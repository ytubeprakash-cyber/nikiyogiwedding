function renderSite(s) {
  const root = $('#siteView');
  root.className = 'view site';
  root.setAttribute('data-theme', s.id);
  root.toggleAttribute('data-dark', !!s.dark);
  root.toggleAttribute('data-script', !!s.v.script);
  const LY = LAYOUT[s.id] || {}; if (LY.divider) root.setAttribute('data-div', LY.divider); else root.removeAttribute('data-div');
  root.removeAttribute('style');
  Object.entries(VAR_MAP).forEach(([k, css]) => { if (s.v[k] != null) root.style.setProperty(css, s.v[k]); });
  root.style.setProperty('--pat', PATTERNS[s.pattern[0]](s.pattern[1]));
  root.style.setProperty('--wave', svgUrl(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 40' preserveAspectRatio='none'><path d='M0 40V22C240 0 480 0 720 18s480 22 720 0v22z' fill='${s.v.alt}'/></svg>`));
  NAV = s.id === 'editorial' ? NAV_LOVE : NAV_DEFAULT;
  if (s.id === 'shubh') {
    NAV = []; root.innerHTML = shubhHTML(s); document.title = `${CONFIG.groom} & ${CONFIG.bride} — Shubh Vivah`;
    root.addEventListener('click', onSiteClick); app.cleanup.push(() => root.removeEventListener('click', onSiteClick));
    initShubh(root); revealAll(root); return;
  }
  root.innerHTML = s.id === 'editorial' ? loveHTML(s) : siteHTML(s);
  const clock = $('[data-clock]', root);
  if (clock) { const upd = () => { clock.textContent = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' }) + ' IST'; }; upd(); const ci = setInterval(upd, 15000); app.cleanup.push(() => clearInterval(ci)); }
  document.title = `${CONFIG.groom} & ${CONFIG.bride} — ${CONFIG.dateShort}`;

  // in-page jumps (hash is used for routing, so scroll manually)
  root.addEventListener('click', onSiteClick);
  app.cleanup.push(() => root.removeEventListener('click', onSiteClick));

  // nav solid + scroll spy + mobile rsvp + thread
  const nav = $('#sNav'), mR = $('#mRsvp'), rsvp = $('#rsvp');
  const secs = NAV.map(([id]) => $('#' + id));
  const fill = $('#threadFill');
  let knots = [];
  if (fill) {
    knots = $$('.sec', root).map((sec) => { const k = document.createElement('span'); k.className = 'knot'; sec.appendChild(k); const h = $('.sec__head, .intro', sec); k.style.top = (h ? h.offsetTop + 8 : 80) + 'px'; return k; });
  }
  const onScroll = () => {
    const y = window.scrollY;
    nav.classList.toggle('is-solid', y > 40);
    const r = rsvp.getBoundingClientRect();
    mR.classList.toggle('is-hidden', y < 300 || (r.top < innerHeight && r.bottom > 0));
    let here = null; secs.forEach((sec) => { if (sec && sec.getBoundingClientRect().top < innerHeight * 0.35) here = sec.id; });
    $$('.s-nav__links a').forEach((a) => a.classList.toggle('is-here', a.getAttribute('href') === '#' + here));
    if (fill) {
      const max = root.scrollHeight; const pos = Math.min(max, y + innerHeight * 0.6);
      fill.style.height = pos + 'px';
      knots.forEach((k) => { const top = k.getBoundingClientRect().top + y; k.classList.toggle('tied', top < pos); });
    }
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  app.cleanup.push(() => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); });
  onScroll();

  // mobile site menu
  const menu = $('#sMenu');
  $('[data-smenu]', root).addEventListener('click', () => { menu.classList.add('is-open'); menu.setAttribute('aria-hidden', 'false'); document.body.classList.add('no-scroll'); });
  $('[data-smenu-close]', root).addEventListener('click', () => closeSiteMenu());

  // venues
  const showVenue = (k) => {
    const v = VENUES[k];
    $$('.venue-tab', root).forEach((b) => b.setAttribute('aria-selected', b.dataset.venue === k));
    $('#venueCard').innerHTML = `<div class="venue-map"><div class="venue-map__load"><div>${I('pin')}<br>${v.area}</div><button class="btn btn--ghost btn--sm" data-loadmap="${esc(v.q)}">Show interactive map</button></div></div>
      <div class="venue-info"><div class="eyebrow">${v.role}</div><h3>${v.name}</h3><p>${v.note}</p><p>${v.address} · ${v.drive}</p>
      <div class="row"><a class="btn btn--solid btn--sm" href="${mapsUrl(v.q)}" target="_blank" rel="noopener">${I('pin')} Directions</a><a class="btn btn--ghost btn--sm" href="tel:${v.phone.replace(/\s/g, '')}">Call venue</a><a class="btn btn--ghost btn--sm" href="${v.web}" target="_blank" rel="noopener">${I('globe')} Website</a></div></div>`;
  };
  $$('.venue-tab', root).forEach((b) => b.addEventListener('click', () => showVenue(b.dataset.venue)));
  if ($('#venueCard')) showVenue(Object.keys(VENUES)[0]);

  // rsvp + blessings
  const wall = $('#wall');
  const paintWall = () => { const mine = store.get('yn-bless', []); const all = [...mine, ...BLESSINGS_SEED].slice(0, 6); wall.innerHTML = all.length ? all.map((b) => `<div class="bless"><p>“${esc(b.text)}”</p><div><b>${esc(b.name)}</b> · ${esc(b.side)}</div></div>`).join('') : '<div class="bless"><p>Be the first to leave a blessing for the couple — add one with your RSVP.</p></div>'; };
  paintWall();
  const form = $('#rsvpForm');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(form));
    if (!d.name.trim()) { $('#f-name').focus(); toast('Please add your name'); return; }
    store.set('yn-rsvp', d);
    if (d.msg.trim()) { const mine = store.get('yn-bless', []); mine.unshift({ name: d.name, side: d.side, text: d.msg }); store.set('yn-bless', mine.slice(0, 5)); paintWall(); }
    const text = `RSVP — ${CONFIG.groom} & ${CONFIG.bride}, 12 Dec 2026\nName: ${d.name}\nPhone: ${d.phone || '-'}\nResponse: ${d.attend}\nWith: ${d.side}\nGuests: ${d.count}\nMeal: ${d.meal}\nArrival: ${d.arrival}${d.msg ? `\nBlessing: ${d.msg}` : ''}`;
    $('#okText').textContent = d.attend.startsWith('Joy') ? `We can’t wait to celebrate with you, ${d.name.split(' ')[0]}. Tap below to send your RSVP to the family on WhatsApp.` : `We’ll miss you, ${d.name.split(' ')[0]}. Tap below to let the family know.`;
    $('#okWa').href = waUrl(text);
    form.classList.add('is-done');
  });
  $('#okEdit').addEventListener('click', () => form.classList.remove('is-done'));

  if (s.id === 'editorial') initLove(root);
  // reveal
  revealAll(root);
}
function closeSiteMenu() { const m = $('#sMenu'); if (!m) return; m.classList.remove('is-open'); m.setAttribute('aria-hidden', 'true'); document.body.classList.remove('no-scroll'); }
function onSiteClick(e) {
  const j = e.target.closest('[data-jump]');
  if (j) { e.preventDefault(); closeSiteMenu(); const t = $(j.getAttribute('href')); if (t) { const y = t.getBoundingClientRect().top + scrollY - (t.id === 'top' ? 80 : 60); window.scrollTo({ top: Math.max(0, y), behavior: REDUCED ? 'auto' : 'smooth' }); } return; }
  if (e.target.closest('[data-ics]')) { downloadICS(); return; }
  const es = e.target.closest('[data-evscroll]');
  if (es) { const t = $('#evTrack'); t.scrollBy({ left: Number(es.dataset.evscroll) * (t.firstElementChild.offsetWidth + 20), behavior: 'smooth' }); return; }
  const lm = e.target.closest('[data-loadmap]');
  if (lm) { lm.closest('.venue-map').innerHTML = `<iframe title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent(lm.dataset.loadmap)}&z=15&output=embed"></iframe>`; }
}
function revealAll(root) {
  const els = $$('.rv', root);
  if (REDUCED || !('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('in')); return; }
  const io = new IntersectionObserver((ents) => ents.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
  els.forEach((e) => io.observe(e));
  app.cleanup.push(() => io.disconnect());
}

function initLove(root) {
  // splash (once per session)
  const sp = $('#splash'); let seen = false; try { seen = sessionStorage.getItem('yn-splash') === '1'; } catch (e) {}
  if (seen) sp.remove(); else { document.body.classList.add('no-scroll');
    $('#splashBtn').addEventListener('click', () => { sp.classList.add('is-gone'); document.body.classList.remove('no-scroll'); try { sessionStorage.setItem('yn-splash', '1'); } catch (e) {} chime(); setTimeout(() => { sp.remove(); $('.collage').classList.add('in'); }, 700); }); }
  if (seen) requestAnimationFrame(() => $('.collage').classList.add('in'));
  app.cleanup.push(() => document.body.classList.remove('no-scroll'));

  // story stack + chapters
  const cards = $$('.stack__card', root); let order = cards.map((_, i) => i); let ch = 0;
  const layout = () => order.forEach((ci, pos) => { const c = cards[ci]; c.style.zIndex = 10 - pos; c.style.transform = `translate(${pos * 10}px, ${pos * -12}px) rotate(${[-2.5, 3, -5][pos] || 0}deg)`; c.style.opacity = pos > 2 ? 0 : 1; });
  const setCh = (i) => { ch = i; $('#lsYear').textContent = STORY[i].year; $('#lsTitle').textContent = STORY[i].title; $('#lsText').textContent = STORY[i].text; $$('.ls-tabs button', root).forEach((b, k) => b.setAttribute('aria-selected', k === i)); };
  const next = () => { const top = cards[order[0]]; top.classList.add('fly'); setTimeout(() => { top.classList.remove('fly'); order.push(order.shift()); layout(); setCh(order[0]); }, 380); };
  layout();
  $('#stack').addEventListener('click', next);
  $('#stack').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } });
  $$('.ls-tabs button', root).forEach((b) => b.addEventListener('click', () => { const i = Number(b.dataset.ch); while (order[0] !== i) order.push(order.shift()); layout(); setCh(i); }));

  // bento modal

function renderPainted(c, root, run) {
  const alive = () => run === cardRun;
  root.innerHTML = `<div class="cv-top"><button class="cv-btn cv-music" id="cvSound" aria-label="Background music" aria-pressed="false"><span class="eq"><i></i><i></i><i></i><i></i></span><span class="cv-music__l">Music</span></button><button class="cv-btn" id="cvReplay" aria-label="Replay">${I('replay')}</button></div>
    ${paintedPageHTML(c)}${envelopeOverlayHTML(c)}`;
  const mbtn = $('#cvSound'); const syncM = () => { mbtn.classList.toggle('on', MUSIC.on); mbtn.setAttribute('aria-pressed', MUSIC.on); };
  mbtn.addEventListener('click', (e) => { e.stopPropagation(); soundOn = MUSIC.toggle(); store.set('yn-sound', soundOn); syncM(); });
  root.addEventListener('pointerdown', () => { if (soundOn && !MUSIC.on) { MUSIC.start(); syncM(); } }, { once: true });
  app.cleanup.push(() => { MUSIC.stop(); });
  $('#cvReplay').addEventListener('click', () => { window.scrollTo(0, 0); app.cleanup.forEach((fn) => { try { fn(); } catch (e) {} }); app.cleanup = []; renderCard(c); });
  root.onclick = (e) => { if (e.target.closest('[data-ics]')) downloadICS(); };
  const fx = createFX(root); app.cleanup.push(() => fx.stop());
  document.body.classList.add('no-scroll'); app.cleanup.push(() => document.body.classList.remove('no-scroll'));
  const rb = $('#rb'), pl = $('#pl');
  // idle: drifting blossoms over the painting
  const stopIdle = AMBIENT.petals(fx, 2.2);
  let opened = false;
  const open = async () => {
    if (opened) return; opened = true; rb.classList.add('is-opening'); root.classList.add('is-opening'); if (soundOn) MUSIC.start();
    const $r = (s) => $(s, rb);
    A($r('.rb__hint'), [{ opacity: 1 }, { opacity: 0 }], { duration: 400 });
    sfx('slide');
    $$('.bow-loop', rb).forEach((l, i) => A(l, [{ transform: 'scale(1) rotate(0)', opacity: 1 }, { transform: `scale(.2) rotate(${i ? 40 : -40}deg)`, opacity: 0 }], { duration: 700, easing: EASE.in }));
    $$('.bow-tail', rb).forEach((l, i) => A(l, [{ transform: 'none', opacity: 1 }, { transform: `translate(${i ? 30 : -30}px, 40px) rotate(${i ? 20 : -20}deg)`, opacity: 0 }], { duration: 700, easing: EASE.in }));
    A($r('.bow-knot'), [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.3)', opacity: 0 }], { duration: 500, delay: 250, easing: EASE.in });
    await sleep(380);
    A($r('.rb__ribbon.a span'), [{ transform: 'translateX(0)' }, { transform: 'translateX(-120%)' }], { duration: 1100, easing: EASE.inOut });
    A($r('.rb__ribbon.b span'), [{ transform: 'translateX(0)' }, { transform: 'translateX(120%)' }], { duration: 1100, easing: EASE.inOut });
    await sleep(800);
    A($r('.rb__folds'), [{ opacity: 1 }, { opacity: 0 }], { duration: 400 });
    const flaps = [['t', 'rotateX(0deg)', 'rotateX(-178deg)'], ['l', 'rotateY(0deg)', 'rotateY(-178deg)'], ['r', 'rotateY(0deg)', 'rotateY(178deg)'], ['b', 'rotateX(0deg)', 'rotateX(178deg)']];
    for (let i = 0; i < flaps.length; i++) {
      const [k, from, to] = flaps[i], el = $r('.rb__flap.' + k); sfx('paper');
      el.style.zIndex = 10 + i;
      A(el, [{ transform: from }, { transform: to, offset: 1 }], { duration: 1150, easing: EASE.inOut });
      A($('.rb__shade', el), [{ opacity: 0 }, { opacity: .55, offset: .5 }, { opacity: .2 }], { duration: 1150 });
      A(el, [{ opacity: 1 }, { opacity: 1, offset: .7 }, { opacity: 0 }], { duration: 1150 });
      if (i === 1) startHero();
      await sleep(330);
    }
    await sleep(900); chime(); sfx('sparkle');
    fx.burst('dust', innerWidth / 2, innerHeight * .45, 50, { min: 40, max: 260, life: 2, size: 2.6, drag: .95 });
    rb.remove(); stopIdle(); document.body.classList.remove('no-scroll');
    openBoom(fx); app.cleanup.push(scrollBooms(fx)); AMBIENT.petals(fx, 2.4);
  };
  let heroStarted = false;
  const startHero = () => { if (heroStarted) return; heroStarted = true; $$('.pt-hero [data-rv]', pl).forEach((e, i) => { e.style.transitionDelay = (300 + i * 140) + 'ms'; e.classList.add('in'); }); };
  $$('[data-open]', rb).forEach((b) => b.addEventListener('click', open));
  // scroll reveals + parallax
  const io = new IntersectionObserver((ents) => { let k = 0; ents.forEach((en) => { if (en.isIntersecting && !en.target.closest('.pt-hero')) { en.target.style.transitionDelay = (k++ * 110) + 'ms'; en.target.classList.add('in'); io.unobserve(en.target); } }); }, { rootMargin: '0px 0px -8% 0px', threshold: .08 });
  $$('[data-rv]', pl).forEach((e) => io.observe(e)); app.cleanup.push(() => io.disconnect());
  const pars = $$('[data-par]', pl);
  const onS = () => { pars.forEach((p) => { const r = p.parentElement.getBoundingClientRect(); const k = +p.dataset.par; p.style.transform = `translateY(${(-(r.top + r.height / 2 - innerHeight / 2) * k).toFixed(1)}px) scale(1.12)`; }); };
  window.addEventListener('scroll', onS, { passive: true }); onS(); app.cleanup.push(() => window.removeEventListener('scroll', onS));
  if (REDUCED) { $$('[data-rv]', pl).forEach((e) => e.classList.add('in')); }
}

    <p class="sh-formal rv">${T(`With the blessings of our elders, the ${CONFIG.groomFamily} and ${CONFIG.brideFamily} families joyfully request the pleasure of your company, with your family, at the wedding of`, 'बड़ों के आशीर्वाद से, किरोड़ीवाल एवं मीणा परिवार आपको सपरिवार हमारे बच्चों के शुभ विवाह में पधारने का हार्दिक निमंत्रण देते हैं')}</p>
    <div class="sh-couple">
      <div class="sh-p rv"><small>${T('Chi.', 'चि.')}</small><b>${T(CONFIG.groomFull, 'योगेश')}</b><span>${T(`${CONFIG.groomFamily} family`, 'किरोड़ीवाल परिवार')}</span></div>
      <div class="sh-with rv">${T('with', 'संग')}</div>
      <div class="sh-p rv"><small>${T('Ayu.', 'आयु.')}</small><b>${T(CONFIG.brideFull, 'निकिता')}</b><span>${T(`${CONFIG.brideFamily} family`, 'मीणा परिवार')}</span></div>
    </div>
    <div class="sh-garland rv">${swag()}</div>
  </section>

  <section class="sh-sec" id="celebrations">
    <h2 class="sh-h rv">${T('Celebrations', 'उत्सव')}</h2>
    <p class="sh-sub rv">${T('One day · six ceremonies · Jaipur', 'एक दिन · छह रस्में · जयपुर')}</p>
    <div class="sh-evs">${ev}</div>
  </section>

  <section class="sh-sec sh-paper" id="rsvp">
    <h2 class="sh-h dark rv">${T('Kindly reply', 'कृपया उत्तर दें')}</h2>
    <p class="sh-sub dark rv">${T(`by ${CONFIG.rsvpBy}`, '25 नवंबर 2026 तक')}</p>
    <form class="sh-form rv" id="shForm" novalidate>
      <div class="sh-f"><label for="sh-name">${T('Your name', 'आपका नाम')}</label><input id="sh-name" name="name" autocomplete="name" required></div>
      <fieldset class="sh-f"><legend>${T('Invited by', 'किसकी ओर से आमंत्रित')}</legend><div class="sh-chips">
        <label><input type="radio" name="side" value="Yogesh's family" checked><span>${T("Yogesh's family", 'योगेश का परिवार')}</span></label>
        <label><input type="radio" name="side" value="Nikita's family"><span>${T("Nikita's family", 'निकिता का परिवार')}</span></label></div></fieldset>
      <fieldset class="sh-f"><legend>${T('Will you attend?', 'क्या आप पधारेंगे?')}</legend><div class="sh-chips">
        <label><input type="radio" name="attend" value="Joyfully accepts" checked><span>${T('Joyfully accept', 'सहर्ष स्वीकार')}</span></label>
        <label><input type="radio" name="attend" value="Regretfully declines"><span>${T('Regretfully decline', 'खेद सहित असमर्थ')}</span></label></div></fieldset>
      <fieldset class="sh-f" id="shEvents"><legend>${T('Which celebrations?', 'किन उत्सवों में?')}</legend><div class="sh-chips wrap">
        <label><input type="checkbox" value="All" data-all checked><span>${T('All', 'सभी')}</span></label>
        ${EVENTS.map((e) => `<label><input type="checkbox" name="events" value="${e.name}" checked><span>${T(e.name, e.hi)}</span></label>`).join('')}</div></fieldset>
      <div class="sh-f"><span class="sh-lbl">${T('Number of guests', 'अतिथियों की संख्या')}</span><div class="sh-step"><button type="button" data-step="-1" aria-label="Fewer guests">−</button><output id="shCount">2</output><button type="button" data-step="1" aria-label="More guests">+</button></div></div>
      <div class="sh-f"><label for="sh-phone">${T('Phone (optional)', 'फ़ोन (वैकल्पिक)')}</label><input id="sh-phone" name="phone" type="tel" autocomplete="tel" placeholder="+91"></div>
      <div class="sh-f"><label for="sh-msg">${T('A blessing for the couple (optional)', 'नवदंपति के लिए आशीर्वाद (वैकल्पिक)')}</label><textarea id="sh-msg" name="msg" rows="3"></textarea></div>
      <label class="sh-tick"><input type="checkbox" name="public" checked><span>${T('Show my blessing on the blessings wall', 'मेरा संदेश आशीर्वाद-पटल पर दिखाएँ')}</span></label>
      <button class="sh-send" type="submit">${T('Send RSVP', 'उत्तर भेजें')}</button>
      <div class="sh-ok" id="shOk" role="status"><h3>${T('Thank you', 'धन्यवाद')}</h3><p id="shOkT"></p><a class="sh-send" id="shOkWa" target="_blank" rel="noopener">${I('chat')} ${T('Send on WhatsApp', 'व्हाट्सऐप पर भेजें')}</a><button type="button" class="sh-btn" id="shEdit">${T('Edit reply', 'उत्तर बदलें')}</button></div>
    </form>
  </section>

  <section class="sh-sec" id="blessings">
    <h2 class="sh-h rv">${T('Blessings', 'आशीर्वाद')}</h2>
    <div class="sh-wall" id="shWall"></div>
  </section>

  <section class="sh-sec sh-count">
    <h2 class="sh-h rv">${T('Counting down', 'उलटी गिनती')}</h2>
    <div class="sh-cd rv" data-cd><div><b data-d>00</b><span>${T('Days', 'दिन')}</span></div><div><b data-h>00</b><span>${T('Hours', 'घंटे')}</span></div><div><b data-m>00</b><span>${T('Minutes', 'मिनट')}</span></div><div><b data-s>00</b><span>${T('Seconds', 'सेकंड')}</span></div></div>
  </section>

  <footer class="sh-sec sh-close">
    <div class="sh-lks small">${[80, 120, 80].map((h, i) => `<span style="--d:${i * .3}s">${latkan(h)}</span>`).join('')}</div>
    <p class="sh-close__t rv">${T('We look forward to celebrating with you', 'आपके साथ यह उत्सव मनाने की प्रतीक्षा में')}</p>
    <p class="sh-close__f rv">${T(`With love, the ${CONFIG.groomFamily} &amp; ${CONFIG.brideFamily} families`, 'सप्रेम, किरोड़ीवाल एवं मीणा परिवार')}</p>
    <p class="sh-tag rv">${CONFIG.hashtag}</p>
    <div class="sh-diya rv">${ILL.ICO_EV.pheras}</div>
  </footer>`;
}

function downloadOneICS(e) {
  const v = VENUES[e.venue];
  const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//YN Wedding//EN', 'BEGIN:VEVENT', `UID:${e.id}-yn-20261212@wedding`, 'DTSTAMP:20261101T000000Z', `DTSTART:${e.ics[0]}`, `DTEND:${e.ics[1]}`, `SUMMARY:${e.name} · ${CONFIG.groom} & ${CONFIG.bride}`, `LOCATION:${v.name}\\, ${v.address.replace(/,/g, '\\,')}`, `DESCRIPTION:${e.title}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar' })); a.download = `${e.name}-Yogesh-Nikita.ics`; document.body.appendChild(a); a.click(); a.remove();
}

function initShubh(root) {
  let lang = store.get('yn-lang', 'en');
  const applyLang = () => { root.setAttribute('data-lang', lang); document.documentElement.lang = lang === 'hi' ? 'hi' : 'en';
    $$('.t', root).forEach((el) => { if (el.dataset.en == null) el.dataset.en = el.innerHTML; el.innerHTML = lang === 'hi' ? el.dataset.hi : el.dataset.en; }); };
  applyLang();
  $('#shLang', root).addEventListener('click', () => { lang = lang === 'hi' ? 'en' : 'hi'; store.set('yn-lang', lang); applyLang(); paintWall(); });

  // music
  const mb = $('#shMusic', root);
  const setM = (v) => { if (v) MUSIC.start(); else MUSIC.stop(); mb.classList.toggle('on', v); };
  mb.addEventListener('click', () => setM(!MUSIC.on));
  app.cleanup.push(() => MUSIC.stop());

  const fx = createFX(root); app.cleanup.push(() => fx.stop()); AMBIENT.petals(fx, 2.4);
  // gate
  const gate = $('#shGate', root); document.body.classList.add('no-scroll'); app.cleanup.push(() => document.body.classList.remove('no-scroll'));
  $('#shOpen', root).addEventListener('click', async () => {
    if (soundOn) setM(true);
    sfx('slide');
    A($('.sh-gate__in', gate), [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.08)', filter: 'blur(6px)' }], { duration: 700, easing: EASE.in });
    A($('.sh-gate__lk', gate), [{ transform: 'translateY(0)' }, { transform: 'translateY(-110%)' }], { duration: 1200, delay: 300, easing: EASE.inOut });
    A($('.sh-gate__half.l', gate), [{ transform: 'translateX(0)' }, { transform: 'translateX(-102%)' }], { duration: 1400, delay: 450, easing: EASE.heavy });
    await A($('.sh-gate__half.r', gate), [{ transform: 'translateX(0)' }, { transform: 'translateX(102%)' }], { duration: 1400, delay: 450, easing: EASE.heavy }).finished;
    gate.remove(); document.body.classList.remove('no-scroll'); chime(); openBoom(fx); app.cleanup.push(scrollBooms(fx));
    $$('.sh-hero .rv', root).forEach((e, i) => { e.style.transitionDelay = (i * 120) + 'ms'; e.classList.add('in'); });
  });

  // calendar menus
  root.addEventListener('click', (e) => {
    const cb = e.target.closest('[data-calmenu]');
    $$('.sh-cal.open', root).forEach((m) => { if (!cb || m !== cb.parentElement) { m.classList.remove('open'); $('[data-calmenu]', m).setAttribute('aria-expanded', 'false'); } });
    if (cb) { const m = cb.parentElement; const o = m.classList.toggle('open'); cb.setAttribute('aria-expanded', o); }
    const one = e.target.closest('[data-ics1]'); if (one) { downloadOneICS(EVENTS[+one.dataset.ics1]); toast(lang === 'hi' ? 'कैलेंडर फ़ाइल डाउनलोड हो गई' : 'Calendar file downloaded'); }
  });

  // RSVP
  const form = $('#shForm', root), count = $('#shCount', root); let n = 2;
  $$('[data-step]', form).forEach((b) => b.addEventListener('click', () => { n = Math.max(1, Math.min(12, n + Number(b.dataset.step))); count.textContent = n; A(count, [{ transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 300, fill: 'none' }); }));
  const all = $('[data-all]', form), evs = $$('input[name="events"]', form);
  all.addEventListener('change', () => evs.forEach((c) => { c.checked = all.checked; }));
  evs.forEach((c) => c.addEventListener('change', () => { all.checked = evs.every((x) => x.checked); }));
  const wall = $('#shWall', root);
  const paintWall = () => { const mine = store.get('yn-bless', []);
    wall.innerHTML = mine.length ? mine.map((b) => `<figure class="sh-b rv in"><blockquote>“${esc(b.text)}”</blockquote><figcaption>${esc(b.name)} · ${esc(b.side)}</figcaption></figure>`).join('')
      : `<div class="sh-empty">${lang === 'hi' ? 'नवदंपति को आशीर्वाद देने वाले पहले व्यक्ति बनें।' : 'Be the first to bless the couple.'} <a href="#rsvp" data-jump>${lang === 'hi' ? 'आशीर्वाद लिखें' : 'Write a blessing'}</a></div>`; };
  paintWall();
  form.addEventListener('submit', (e) => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(form)); d.events = evs.filter((c) => c.checked).map((c) => c.value);
    if (!d.name.trim()) { $('#sh-name', form).focus(); toast(lang === 'hi' ? 'कृपया अपना नाम लिखें' : 'Please add your name'); return; }
    if (d.attend.startsWith('Joy') && !d.events.length) { toast(lang === 'hi' ? 'कम से कम एक उत्सव चुनें' : 'Choose at least one celebration'); return; }
    store.set('yn-rsvp', { ...d, guests: n });
    if (d.msg.trim() && d.public) { const mine = store.get('yn-bless', []); mine.unshift({ name: d.name, side: d.side, text: d.msg }); store.set('yn-bless', mine.slice(0, 8)); paintWall(); }
    const text = `RSVP — ${CONFIG.groom} & ${CONFIG.bride}, 12 Dec 2026\nName: ${d.name}\nInvited by: ${d.side}\nResponse: ${d.attend}\nEvents: ${d.attend.startsWith('Joy') ? (d.events.length === EVENTS.length ? 'All' : d.events.join(', ')) : '-'}\nGuests: ${n}\nPhone: ${d.phone || '-'}${d.msg ? `\nBlessing: ${d.msg}` : ''}`;
    const first = d.name.split(' ')[0];
    $('#shOkT', form).textContent = lang === 'hi' ? (d.attend.startsWith('Joy') ? `${first} जी, आपके आने की प्रतीक्षा रहेगी। नीचे टैप करके परिवार को व्हाट्सऐप पर उत्तर भेजें।` : `${first} जी, आपकी कमी खलेगी। परिवार को सूचित करने के लिए नीचे टैप करें।`)
      : (d.attend.startsWith('Joy') ? `We can’t wait to celebrate with you, ${first}. Tap below to send your reply to the family on WhatsApp.` : `We’ll miss you, ${first}. Tap below to let the family know.`);
    $('#shOkWa', form).href = waUrl(text); form.classList.add('done'); sfx('sparkle');
  });
  $('#shEdit', form).addEventListener('click', () => form.classList.remove('done'));
}

/* pill hides while scrolling down, returns on scroll up */
let lastY = 0;
window.addEventListener('scroll', () => { const y = scrollY; const pill = $('#pill'); if (!pill) return; pill.classList.toggle('is-tucked', y > lastY + 4 && y > 200); if (y < lastY - 4 || y < 200) pill.classList.remove('is-tucked'); lastY = y; }, { passive: true });

/* ---------------- boot ---------------- */
function boot() {
  $('#pillMenu').addEventListener('click', openDrawer);
  $('#pillPrev').addEventListener('click', () => step(-1));
  $('#pillNext').addEventListener('click', () => step(1));
  $('#pillShare').addEventListener('click', share);
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#scrim').addEventListener('click', closeDrawer);
  $('#drawerHome').addEventListener('click', () => { closeDrawer(); go('home'); });
  $('#drawerShare').addEventListener('click', share);
  $('#drawerPrev').addEventListener('click', () => { closeDrawer(); if (app.route.type === 'home') go(ACTIVE_SITES.length ? 'site' : 'card', ACTIVE_SITES[ACTIVE_SITES.length - 1].id); else step(-1); });
  $('#drawerNext').addEventListener('click', () => { closeDrawer(); if (app.route.type === 'home') go('site', ACTIVE_SITES[0].id); else step(1); });
  $('#drawer').addEventListener('click', (e) => { if (e.target.closest('.d-item')) closeDrawer(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeDrawer(); closeSiteMenu(); } });
  if (GUEST) { $('#drawer').remove(); $('#scrim').remove(); }
  render();
}
if (GUEST) { window.openDrawer = () => {}; }
document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', boot) : boot();
})();

</script>
