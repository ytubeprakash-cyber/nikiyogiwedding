<style>
/* =========================================================================
   BASE
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.6; color: #1d1a17; background: #100e0d; -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.view { display: none; }
.view.is-active { display: block; }
body.no-scroll { overflow: hidden; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } html { scroll-behavior: auto; } }

/* =========================================================================
   STUDIO — gallery home
   ========================================================================= */
.studio { --s-bg: #12100e; --s-surface: #1b1815; --s-line: #2e2924; --s-ink: #f3ece0; --s-muted: #a39a8c; --s-gold: #cfae6b;
  min-height: 100vh; min-height: 100dvh; background: var(--s-bg); color: var(--s-ink); }
.studio__inner { max-width: 1200px; margin: 0 auto; padding: clamp(40px, 7vw, 88px) 20px 96px; }
.studio__head { display: grid; gap: 16px; text-align: center; justify-items: center; margin-bottom: clamp(40px, 6vw, 64px); }
.studio__kicker { font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: var(--s-gold); }
.studio__title { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(44px, 8vw, 84px); line-height: 1; letter-spacing: -.01em; }
.studio__title em { font-style: italic; color: var(--s-gold); font-weight: 400; }
.studio__sub { max-width: 560px; color: var(--s-muted); font-size: 15px; }
.seg { display: inline-flex; padding: 4px; border: 1px solid var(--s-line); border-radius: 999px; background: var(--s-surface); gap: 4px; }
.seg button { padding: 10px 20px; border-radius: 999px; font-size: 14px; color: var(--s-muted); transition: background .2s, color .2s; white-space: nowrap; }
.seg button[aria-selected="true"] { background: var(--s-ink); color: var(--s-bg); }
.seg .count { opacity: .6; margin-left: 6px; font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 24px; }
.tile { text-decoration: none; color: inherit; display: flex; flex-direction: column; border: 1px solid var(--s-line); border-radius: 14px; overflow: hidden; background: var(--s-surface); text-align: left; transition: transform .3s ease, border-color .3s ease; }
.tile:hover { transform: translateY(-3px); border-color: #4a4239; }
.tile__preview { position: relative; aspect-ratio: 4 / 3; overflow: hidden; }
.tile--card .tile__preview { aspect-ratio: 4 / 3; }
.tile__body { padding: 20px 20px 22px; display: grid; gap: 8px; }
.tile__row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.tile__num { font-size: 12px; color: var(--s-muted); letter-spacing: .12em; }
.tile__name { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500; line-height: 1.15; }
.tile__desc { font-size: 14px; color: var(--s-muted); line-height: 1.55; }
.tile__cta { margin-top: 6px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--s-gold); }
.tile__cta .ico { width: 16px; height: 16px; }
.studio__foot { margin-top: 56px; text-align: center; color: var(--s-muted); font-size: 13px; }

/* Thumbnail previews (pure CSS mini renders) */
.thumb { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; }
.thumb__names { font-size: clamp(22px, 3vw, 30px); line-height: 1.1; }
.thumb__meta { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; margin-top: 10px; opacity: .8; }
.thumb__arch { width: 34%; aspect-ratio: 3/4; border-radius: 999px 999px 6px 6px; overflow: hidden; margin: 0 auto 12px; border: 1.5px solid currentColor; }
.thumb__arch img { width: 100%; height: 100%; object-fit: cover; }
.thumb__card { width: 46%; aspect-ratio: 5/7; border-radius: 4px; box-shadow: 0 18px 40px rgba(0,0,0,.35); display: grid; place-items: center; padding: 10px; }

/* =========================================================================
   STUDIO CONTROLS — floating pill + drawer
   ========================================================================= */
.pill { position: fixed; z-index: 80; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(18,16,14,.86); color: #f3ece0;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.08);
  transition: opacity .3s, transform .3s; }
.pill button { height: 44px; min-width: 44px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; letter-spacing: .02em; }
.pill button:hover { background: rgba(255,255,255,.1); }
.pill .sep { width: 1px; height: 20px; background: rgba(255,255,255,.14); margin: 0 2px; }
.pill[hidden] { display: none; }
@media (max-width: 520px) { .pill .lbl { display: none; } .pill #pillPrev, .pill #pillNext, .pill #pillShare, .pill .sep { display: none; } .pill #pillMenu { width: 48px; height: 48px; } }
.pill.is-tucked { opacity: 0; transform: translateY(80px); pointer-events: none; }

.scrim { position: fixed; inset: 0; z-index: 90; background: rgba(10,8,6,.5); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.is-open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; z-index: 100; top: 0; bottom: 0; left: 0; width: min(380px, 88vw); background: #12100e; color: #f3ece0;
  transform: translateX(-102%); transition: transform .35s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; border-right: 1px solid #2e2924; }
.drawer.is-open { transform: none; box-shadow: 20px 0 60px rgba(0,0,0,.35); }
.drawer__head { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 16px; border-bottom: 1px solid #2e2924; }
.drawer__brand { display: grid; gap: 2px; }
.drawer__brand b { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 500; line-height: 1.1; }
.drawer__brand span { font-size: 12px; color: #a39a8c; letter-spacing: .06em; }
.icon-btn { width: 44px; height: 44px; border-radius: 999px; display: inline-grid; place-items: center; }
.icon-btn:hover { background: rgba(255,255,255,.08); }
.drawer__body { flex: 1; overflow-y: auto; padding: 16px 12px 24px; }
.drawer__group + .drawer__group { margin-top: 24px; }
.drawer__label { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #cfae6b; padding: 0 8px 10px; }
.d-item { text-decoration: none; color: inherit; width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 8px; border-radius: 10px; text-align: left; }
.d-item:hover { background: #1d1a17; }
.d-item[aria-current="true"] { background: #25211d; }
.d-item__sw { width: 44px; height: 44px; border-radius: 8px; flex: none; border: 1px solid rgba(255,255,255,.12); display: grid; place-items: center; font-size: 13px; overflow: hidden; }
.d-item__t { font-size: 15px; line-height: 1.3; }
.d-item__s { font-size: 12px; color: #a39a8c; line-height: 1.4; }
.drawer__foot { padding: 16px 20px max(16px, env(safe-area-inset-bottom)); border-top: 1px solid #2e2924; display: grid; gap: 8px; }
.btn-line { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 10px; border: 1px solid #3a342d; font-size: 14px; }
.btn-line:hover { background: #1d1a17; }

.toast { position: fixed; z-index: 120; left: 50%; bottom: 84px; transform: translate(-50%, 20px); background: #f3ece0; color: #12100e; padding: 12px 18px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: .3s; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100vw - 32px); text-align: center; }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

/* =========================================================================
   WEBSITE — themed via CSS variables on .site
   ========================================================================= */
.site { background: var(--bg); color: var(--ink); font-family: var(--fb); min-height: 100vh; }
.site .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
@media (min-width: 768px) { .site .wrap { padding: 0 40px; } }
.site .narrow { max-width: 760px; margin: 0 auto; }
.disp { font-family: var(--fd); font-weight: var(--dweight); text-transform: var(--dcase); letter-spacing: var(--dtrack, 0); line-height: 1.08; }
.serif { font-family: var(--fs); }
.eyebrow { font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.sec { padding: clamp(72px, 10vw, 128px) 0; position: relative; }
.sec--alt { background-color: var(--alt); background-image: var(--pat); }
.sec__head { text-align: center; display: grid; gap: 14px; justify-items: center; margin-bottom: clamp(40px, 6vw, 64px); }
.sec__title { font-size: clamp(34px, 5.5vw, 56px); }
.site[data-script] .sec__title { font-size: clamp(44px, 7vw, 72px); }
.sec__lead { max-width: 600px; color: var(--muted); font-family: var(--fs); font-size: clamp(19px, 2.2vw, 22px); line-height: 1.5; }
.rule { display: flex; align-items: center; gap: 14px; color: var(--accent2); }
.rule::before, .rule::after { content: ''; width: 48px; height: 1px; background: currentColor; opacity: .7; }
.rule svg { width: 18px; height: 18px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 26px; border-radius: var(--radius); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; text-decoration: none; transition: transform .2s, background .2s, color .2s, border-color .2s; white-space: nowrap; text-align: center; }
@media (max-width: 480px) { .btn { white-space: normal; line-height: 1.3; padding-top: 10px; padding-bottom: 10px; } }
.btn--solid { background: var(--accent); color: var(--on-accent, #fff); }
.btn--solid:hover { transform: translateY(-1px); filter: brightness(1.06); }
.btn--ghost { border: 1px solid currentColor; }
.btn--ghost:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
.btn--sm { min-height: 40px; padding: 0 16px; font-size: 12px; }
.btn .ico { width: 18px; height: 18px; }

/* Site header */
.s-nav { position: sticky; top: 0; z-index: 40; transition: background .3s, box-shadow .3s, color .3s; color: var(--heroInk); }
.s-nav.is-solid { background: color-mix(in srgb, var(--bg) 92%, transparent); color: var(--ink); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 1px 0 var(--line); }
.s-nav__in { height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.s-nav__mono { font-family: var(--fd); font-size: 22px; letter-spacing: .04em; text-decoration: none; white-space: nowrap; }
.site[data-script] .s-nav__mono { font-size: 28px; }
.s-nav__links { display: none; gap: 28px; list-style: none; margin: 0; padding: 0; }
.s-nav__links a { text-decoration: none; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; padding: 8px 0; border-bottom: 1px solid transparent; }
.s-nav__links a:hover, .s-nav__links a.is-here { opacity: 1; border-bottom-color: currentColor; }
.s-nav__right { display: flex; align-items: center; gap: 8px; }
.s-nav__menu { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 4px 0 12px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
@media (min-width: 960px) { .s-nav__links { display: flex; } .s-nav__menu { display: none; } }
@media (max-width: 959px) { .s-nav .btn--rsvp { display: none; } }
.s-nav--over { position: fixed; left: 0; right: 0; }

.s-menu { position: fixed; inset: 0; z-index: 70; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .3s; }
.s-menu.is-open { opacity: 1; pointer-events: auto; }
.s-menu__top { height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--line); }
.s-menu ul { list-style: none; margin: 0; padding: 24px 20px; display: grid; gap: 4px; overflow-y: auto; }
.s-menu a { display: block; padding: 14px 0; font-family: var(--fd); font-size: 30px; text-decoration: none; text-transform: var(--dcase); border-bottom: 1px solid var(--line); }
.site[data-script] .s-menu a { font-family: var(--fs); }

/* ---------- HERO (shared) ---------- */
.hero { position: relative; overflow: hidden; background: var(--heroBg); color: var(--heroInk); margin-top: -68px; padding-top: 68px; }
.hero__in { min-height: calc(100vh - 0px); min-height: 100svh; display: grid; align-content: center; padding: 48px 0 72px; }
.hero__names { font-size: clamp(48px, 10vw, 112px); }
.site[data-script] .hero__names { font-size: clamp(60px, 12vw, 132px); line-height: 1; }
.hero__amp { font-family: var(--fs); font-style: italic; font-weight: 400; color: var(--heroAccent, var(--accent2)); text-transform: none; }
.hero__date { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; }
.hero__cta { display: flex; flex-wrap: wrap; gap: 12px; max-width: 100%; }
.hero--arch .hero__cta, .hero--stars .hero__cta, .hero--dunes .hero__cta, .hero--thread .hero__cta, .hero--pass .hero__cta { justify-content: center; }
.hero__img { overflow: hidden; }
.hero__img img { width: 100%; height: 100%; object-fit: cover; }
.img-mono img { filter: grayscale(1) contrast(1.05) sepia(.18); }
.img-warm img { filter: saturate(.75) sepia(.22) contrast(1.02); }
.img-night img { filter: saturate(.65) sepia(.15) brightness(.92); }

.countdown { display: flex; gap: clamp(16px, 4vw, 40px); }
.countdown div { display: grid; gap: 4px; text-align: center; min-width: 52px; }
.countdown b { font-family: var(--fs); font-size: clamp(30px, 5vw, 44px); font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.countdown span { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; opacity: .75; }

/* Hero: ARCH (Rajwada) */
.hero--arch .hero__in { justify-items: center; text-align: center; gap: 28px; }
.hero--arch .arch { width: min(300px, 64vw); aspect-ratio: 3 / 4; position: relative; padding: 10px; }
.hero--arch .arch::before { content: ''; position: absolute; inset: 0; border: 1.5px solid var(--accent2); border-radius: 999px 999px 8px 8px; }
.hero--arch .arch .hero__img { width: 100%; height: 100%; border-radius: 999px 999px 4px 4px; }
.hero--arch .hero__names { font-size: clamp(40px, 8vw, 88px); }
.hero--arch .orn-top { width: min(420px, 80vw); color: var(--accent2); }
.hero--arch .invoc { font-family: 'Tiro Devanagari Hindi', serif; font-size: 18px; color: var(--accent2); }

/* Hero: EDITORIAL */
.hero--editorial .hero__in { gap: 32px; padding-top: 32px; }
.hero--editorial .ed-top { display: flex; justify-content: space-between; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--ink); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; }
.hero--editorial .ed-grid { display: grid; gap: 32px; align-items: end; }
.hero--editorial .hero__names { font-size: clamp(56px, 13vw, 168px); line-height: .9; letter-spacing: -.02em; }
.hero--editorial .hero__names i { display: block; font-family: var(--fs); font-weight: 400; font-size: .42em; letter-spacing: 0; color: var(--accent); margin: .2em 0; }
.hero--editorial .hero__img { aspect-ratio: 4 / 5; }
.hero--editorial .ed-side { display: grid; gap: 24px; align-content: end; }
.hero--editorial .ed-side p { font-family: var(--fs); font-size: 22px; line-height: 1.4; color: var(--muted); }
@media (min-width: 900px) { .hero--editorial .ed-grid { grid-template-columns: 1.5fr 1fr; gap: 56px; } }

/* Hero: SPLIT (Pink City) */
.hero--split .hero__in { gap: 40px; }
.hero--split .split { display: grid; gap: 40px; align-items: center; }
.hero--split .split__text { display: grid; gap: 24px; }
.hero--split .split__media { position: relative; max-width: 460px; width: 100%; justify-self: center; }
.hero--split .split__media .hero__img { aspect-ratio: 4 / 5; border-radius: 999px 999px 0 0; }
.hero--split .split__media::after { content: ''; position: absolute; inset: 16px -16px -16px 16px; border: 1px solid var(--accent); border-radius: 999px 999px 0 0; z-index: -1; }
.hero--split .split__media { z-index: 0; isolation: isolate; }
.hero--split .windows { position: absolute; inset: 0; z-index: 0; background-image: var(--pat); opacity: .9; pointer-events: none; }
@media (min-width: 900px) { .hero--split .split { grid-template-columns: 1.1fr 1fr; gap: 72px; } }

/* Hero: STARS (Sheesh Mahal) */
.hero--stars::before { content: ''; position: absolute; inset: 0; background-image: var(--pat); animation: twinkle 6s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }
.hero--stars .hero__in { justify-items: center; text-align: center; gap: 28px; position: relative; }
.hero--stars .medal { width: min(220px, 52vw); aspect-ratio: 1; border-radius: 50%; padding: 8px; border: 1px solid var(--accent); position: relative; }
.hero--stars .medal::after { content: ''; position: absolute; inset: -14px; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--accent) 50%, transparent); }
.hero--stars .medal .hero__img { width: 100%; height: 100%; border-radius: 50%; }
.hero--stars .hero__names { font-size: clamp(40px, 8vw, 92px); }

/* Hero: DUNES (Thar) */
.hero--dunes { min-height: 100svh; }
.hero--dunes .sun { position: absolute; left: 50%; bottom: 20%; width: min(56vw, 300px); aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, #ffe2a6 0%, #f7b267 55%, rgba(247,178,103,0) 72%); }
.hero--dunes .dunes { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 42%; }
.hero--dunes .hero__in { position: relative; z-index: 2; justify-items: center; text-align: center; gap: 22px; align-content: start; min-height: 0; padding: clamp(110px, 16vh, 170px) 0 0; }
.hero--dunes .hero__names { font-size: clamp(56px, 11vw, 132px); font-weight: 400; font-style: italic; text-shadow: 0 2px 30px rgba(60,20,40,.25); }
.hero--dunes .hero__cta { position: relative; }
.hero--dunes .scroll-cue { position: absolute; z-index: 3; left: 50%; bottom: 28px; transform: translateX(-50%); color: #fff6ea; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; display: grid; justify-items: center; gap: 8px; }

/* ---------- INTRO ---------- */
.intro { text-align: center; display: grid; gap: 28px; justify-items: center; }
.intro__quote { font-family: var(--fs); font-size: clamp(24px, 3.4vw, 34px); line-height: 1.4; font-style: italic; max-width: 760px; }
.intro__fam { display: grid; gap: 24px; width: 100%; max-width: 760px; }
.intro__fam > div { display: grid; gap: 6px; }
.intro__fam small { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.intro__fam p { font-family: var(--fs); font-size: 20px; }
@media (min-width: 720px) { .intro__fam { grid-template-columns: 1fr 1fr; gap: 40px; } }

/* ---------- COUPLE ---------- */
.couple { display: grid; gap: 48px; align-items: center; }
.couple__img { aspect-ratio: 1; max-width: 420px; width: 100%; justify-self: center; border-radius: var(--radius); overflow: hidden; }
.couple__img img { width: 100%; height: 100%; object-fit: cover; }
.couple__people { display: grid; gap: 36px; }
.person { display: grid; gap: 8px; padding-left: 20px; border-left: 1px solid var(--line); }
.person h3 { font-size: clamp(28px, 3.6vw, 38px); }
.person small { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.person .par { font-family: var(--fs); font-size: 19px; color: var(--muted); font-style: italic; }
.person p { color: var(--muted); font-size: 15px; }
@media (min-width: 880px) { .couple { grid-template-columns: 1fr 1.1fr; gap: 80px; } }

/* ---------- STORY TIMELINE ---------- */
.story { display: grid; gap: 0; position: relative; max-width: 860px; margin: 0 auto; }
.story__item { display: grid; grid-template-columns: 24px 1fr; gap: 20px; padding-bottom: 48px; position: relative; }
.story__item:last-child { padding-bottom: 0; }
.story__dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--bg); margin: 8px auto 0; position: relative; z-index: 1; }
.story__item::before { content: ''; position: absolute; left: 11.5px; top: 18px; bottom: -8px; width: 1px; background: var(--line); }
.story__item:last-child::before { display: none; }
.story__year { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.story__item h3 { font-family: var(--fs); font-size: clamp(24px, 3vw, 30px); font-weight: 500; margin-bottom: 10px; line-height: 1.25; }
.story__item p { color: var(--muted); max-width: 620px; }
.sec--alt .story__dot { background: var(--alt); }

/* ---------- EVENTS ---------- */
.events { display: grid; gap: 20px; }
@media (min-width: 760px) { .events { grid-template-columns: 1fr 1fr; gap: 24px; } }
@media (min-width: 1100px) { .events { grid-template-columns: repeat(3, 1fr); } }
.ev { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 14px; }
.ev__top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ev__time { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.ev__hi { font-family: 'Tiro Devanagari Hindi', serif; color: var(--muted); font-size: 16px; }
.ev h3 { font-family: var(--fs); font-size: 27px; font-weight: 500; line-height: 1.2; }
.ev p { font-size: 15px; color: var(--muted); }
.ev__meta { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; }
.ev__meta div { display: flex; gap: 10px; align-items: flex-start; }
.ev__meta .ico { width: 17px; height: 17px; margin-top: 3px; color: var(--accent); }
.ev__sw { display: inline-flex; gap: 4px; margin-left: auto; padding-left: 8px; }
.ev__sw i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); }
.ev__actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
.ev__actions .btn { color: var(--ink); }

/* ---------- VENUES ---------- */
.venues { display: grid; gap: 24px; }
@media (min-width: 900px) { .venues { grid-template-columns: 340px 1fr; gap: 32px; align-items: start; } }
.venue-tabs { display: grid; gap: 8px; }
.venue-tab { text-align: left; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); display: grid; gap: 4px; transition: border-color .2s, background .2s; }
.venue-tab b { font-family: var(--fs); font-size: 22px; font-weight: 500; line-height: 1.2; }
.venue-tab span { font-size: 13px; color: var(--muted); }
.venue-tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
@media (max-width: 899px) { .venue-tabs { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; } .venue-tab { flex: 0 0 auto; scroll-snap-align: start; min-width: 200px; } }
.venue-card { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.venue-map { aspect-ratio: 16 / 9; background: var(--alt); position: relative; }
.venue-map iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; filter: grayscale(.25); }
.venue-map__load { position: absolute; inset: 0; display: grid; place-items: center; gap: 12px; text-align: center; color: var(--muted); font-size: 14px; background-image: var(--pat); }
.venue-info { padding: 24px; display: grid; gap: 12px; }
.venue-info h3 { font-family: var(--fs); font-size: 30px; font-weight: 500; }
.venue-info p { color: var(--muted); font-size: 15px; }
.venue-info .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.venue-info .btn { color: var(--ink); }

/* ---------- INFO CARDS (travel) ---------- */
.cards4 { display: grid; gap: 20px; }
@media (min-width: 700px) { .cards4 { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1100px) { .cards4 { grid-template-columns: repeat(4, 1fr); } }
.info { padding: 28px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: grid; gap: 12px; align-content: start; }
.info .ico { width: 28px; height: 28px; color: var(--accent); stroke-width: 1.2; }
.info h3 { font-family: var(--fs); font-size: 24px; font-weight: 500; }
.info p { font-size: 15px; color: var(--muted); }

/* ---------- DRESS CODE ---------- */
.dress { display: grid; gap: 0; border-top: 1px solid var(--line); }
.dress__row { display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; padding: 20px 0; border-bottom: 1px solid var(--line); align-items: center; }
.dress__row b { font-family: var(--fs); font-size: 24px; font-weight: 500; }
.dress__row span { color: var(--muted); font-size: 15px; grid-column: 1; }
.dress__sw { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; }
.dress__sw i { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(0,0,0,.1); }
@media (min-width: 760px) { .dress__row { grid-template-columns: 200px 1fr auto; } .dress__row span { grid-column: 2; } .dress__sw { grid-column: 3; grid-row: 1; } }

/* ---------- FAQ ---------- */
.faq { border-top: 1px solid var(--line); }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 22px 0; font-family: var(--fs); font-size: clamp(20px, 2.4vw, 24px); font-weight: 500; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary .ico { transition: transform .3s; color: var(--accent); }
.faq details[open] summary .ico { transform: rotate(45deg); }
.faq details p { padding: 0 0 24px; color: var(--muted); max-width: 680px; }

/* ---------- RSVP ---------- */
.rsvp { display: grid; gap: 40px; }
@media (min-width: 960px) { .rsvp { grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: start; } }
.form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(24px, 4vw, 40px); display: grid; gap: 20px; }
.field { display: grid; gap: 8px; }
.field label, .field legend { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 0; }
.field input, .field select, .field textarea { width: 100%; min-height: 48px; padding: 12px 14px; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: calc(var(--radius) / 2 + 2px); appearance: none; -webkit-appearance: none; }
.field textarea { min-height: 96px; resize: vertical; }
.field select { background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.field-row { display: grid; gap: 20px; }
@media (min-width: 560px) { .field-row { grid-template-columns: 1fr 1fr; } }
fieldset.field { border: 0; margin: 0; padding: 0; }
.choice { display: flex; gap: 8px; flex-wrap: wrap; }
.choice label { flex: 1 1 140px; position: relative; text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--ink); }
.choice input { position: absolute; opacity: 0; }
.choice span { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: calc(var(--radius) / 2 + 2px); background: var(--bg); text-align: center; }
.choice input:checked + span { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); color: var(--accent); }
.choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.form .btn { width: 100%; }
.form__ok { display: none; text-align: center; gap: 12px; padding: 24px 0; }
.form.is-done .form__fields { display: none; }
.form.is-done .form__ok { display: grid; }
.form__ok h3 { font-family: var(--fs); font-size: 30px; font-weight: 500; }
.form__ok p { color: var(--muted); }
.wall { display: grid; gap: 16px; }
.wall h3 { font-family: var(--fs); font-size: 28px; font-weight: 500; }
.bless { padding: 22px 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); display: grid; gap: 10px; }
.bless p { font-family: var(--fs); font-size: 19px; line-height: 1.5; font-style: italic; }
.bless div { font-size: 13px; color: var(--muted); }
.bless b { color: var(--ink); font-weight: 600; }

/* ---------- FOOTER ---------- */
.s-foot { background: var(--heroBg); color: var(--heroInk); text-align: center; padding: clamp(72px, 10vw, 120px) 0 112px; display: grid; gap: 18px; justify-items: center; }
.site:not([data-dark]) .s-foot--plain { background: var(--ink); color: var(--bg); }
.s-foot .disp { font-size: clamp(40px, 7vw, 72px); }
.s-foot p { opacity: .8; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; }

/* mobile sticky RSVP */
.m-rsvp { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: opacity .3s, transform .3s; }
.m-rsvp.is-hidden { opacity: 0; transform: translateY(20px); pointer-events: none; }
@media (min-width: 960px) { .m-rsvp { display: none; } }

/* reveal on scroll */
.rv { opacity: 0; transform: translateY(24px); transition: opacity .8s ease, transform .8s ease; }
.rv.in { opacity: 1; transform: none; }

/* Theme specifics */
.site[data-theme="editorial"] .ev, .site[data-theme="editorial"] .info, .site[data-theme="editorial"] .form, .site[data-theme="editorial"] .venue-card { background: transparent; }
.site[data-theme="editorial"] .sec__title { letter-spacing: -.01em; }
.site[data-theme="rajwada"] .ev { border-top: 3px solid var(--accent2); }
.site[data-dark] .field input, .site[data-dark] .field select, .site[data-dark] .field textarea, .site[data-dark] .choice span { background: var(--alt); }
.site[data-dark] .btn--solid { --on-accent: #0c1124; }

/* =========================================================================
   INVITATION CARD VIEW
   ========================================================================= */
.cardview { min-height: 100vh; min-height: 100dvh; background: var(--stage); color: var(--ink); position: relative; overflow-x: hidden; }
.cardview::before { content: ''; position: fixed; inset: 0; background-image: var(--pat); opacity: .5; pointer-events: none; }
.cv-top { position: fixed; z-index: 50; top: 0; right: 0; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 0; display: flex; gap: 8px; }
.cv-btn { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; background: rgba(0,0,0,.28); color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.14); }
.cv-btn:hover { background: rgba(0,0,0,.45); }
.cv-stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 72px 16px 96px; }
.cv-hint { margin-top: 28px; text-align: center; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--hint, rgba(255,255,255,.82)); animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }
.cv-opener { width: min(420px, 100%); display: grid; justify-items: center; transition: opacity .6s, transform .6s; }
.cv-opener.is-gone { opacity: 0; transform: scale(.96); pointer-events: none; position: absolute; }
.cv-card { width: min(460px, 100%); opacity: 0; transform: translateY(24px); transition: opacity .9s ease .1s, transform .9s ease .1s; display: none; }
.cv-card.is-shown { display: block; }
.cv-card.is-in { opacity: 1; transform: none; }

/* The paper */
.paper { background: var(--paper); color: var(--ink); position: relative; padding: 56px 32px 48px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.35); font-family: var(--fs); }
@media (min-width: 420px) { .paper { padding: 64px 44px 56px; } }
.paper > * + * { margin-top: 28px; }
.paper .frame { position: absolute; inset: 12px; border: 1px solid var(--line); pointer-events: none; margin: 0; }
.paper .frame::after { content: ''; position: absolute; inset: 4px; border: 1px solid var(--line); opacity: .55; }
.paper--arch { border-radius: 999px 999px 6px 6px; padding-top: 96px; }
.paper--arch .frame { border-radius: 999px 999px 2px 2px; }
.paper--arch .frame::after { border-radius: 999px 999px 0 0; }
.paper--deco .frame { border-color: var(--accent); }
.paper--deco .frame::after { inset: 6px; border-style: solid; }
.p-invoc { font-family: 'Tiro Devanagari Hindi', serif; font-size: 17px; color: var(--accent); letter-spacing: .04em; }
.p-orn { width: 120px; margin-left: auto; margin-right: auto; color: var(--accent); }
.p-orn svg { width: 100%; height: auto; display: block; }
.p-small { font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); font-family: 'Inter', sans-serif; line-height: 1.8; }
.p-parents { font-size: 19px; line-height: 1.5; font-style: italic; color: var(--muted); }
.p-names { font-family: var(--fd); font-size: clamp(38px, 10vw, 52px); line-height: 1.1; color: var(--ink); text-transform: uppercase; letter-spacing: .04em; font-weight: 400; }
.p-names .amp { display: block; font-family: var(--script); text-transform: none; font-size: .9em; color: var(--accent); margin: 4px 0; letter-spacing: 0; }
.p-portrait { width: 132px; height: 132px; margin-left: auto; margin-right: auto; border-radius: 50%; overflow: hidden; border: 1px solid var(--line); padding: 4px; }
.p-portrait img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; filter: saturate(.8) sepia(.12); }
.p-date { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; max-width: 320px; margin-left: auto; margin-right: auto; }
.p-date span { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.p-date b { font-family: var(--fd); font-size: 56px; font-weight: 400; line-height: 1; color: var(--accent); }
.p-date small { display: block; font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; margin-top: 6px; color: var(--ink); }
.p-venue { font-size: 20px; line-height: 1.45; }
.p-venue b { display: block; font-family: var(--fd); font-weight: 400; font-size: 22px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.p-divider { height: 1px; background: var(--line); max-width: 160px; margin-left: auto !important; margin-right: auto !important; }
.p-sched { display: grid; gap: 0; text-align: left; border-top: 1px solid var(--line); }
.p-sched div { display: grid; grid-template-columns: 82px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.p-sched time { font-family: 'Inter', sans-serif; font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 500; }
.p-sched b { font-family: var(--fd); font-weight: 400; font-size: 17px; text-transform: uppercase; letter-spacing: .06em; display: block; line-height: 1.3; }
.p-sched span { font-size: 16px; color: var(--muted); line-height: 1.4; }
.p-actions { display: grid; gap: 10px; }
.p-btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 18px; border: 1px solid var(--accent); color: var(--accent); font-family: 'Inter', sans-serif; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; transition: background .2s, color .2s; }
.p-btn:hover { background: var(--accent); color: var(--paper); }
.p-btn--solid { background: var(--accent); color: var(--paper); }
.p-btn .ico { width: 17px; height: 17px; }
.p-sign { font-family: var(--script); font-size: 30px; color: var(--accent); }
.p-reply { font-size: 16px; font-style: italic; color: var(--muted); }

/* ---- Opener: ENVELOPE ---- */
.env { width: min(360px, 88vw); aspect-ratio: 1.42; position: relative; perspective: 1200px; cursor: pointer; }
.env__back { position: absolute; inset: 0; background: var(--env); border-radius: 6px; box-shadow: 0 30px 60px rgba(0,0,0,.4); }
.env__liner { position: absolute; inset: 8px 8px auto; height: 60%; background-image: var(--pat2); background-color: var(--env2); clip-path: polygon(0 0, 100% 0, 50% 100%); opacity: .7; }
.env__sides { position: absolute; inset: 0; background: linear-gradient(to top right, var(--env2) 50%, transparent 50.5%) left bottom / 50.5% 100% no-repeat, linear-gradient(to top left, var(--env2) 50%, transparent 50.5%) right bottom / 50.5% 100% no-repeat; border-radius: 6px; filter: brightness(.94); }
.env__flap { position: absolute; left: 0; right: 0; top: 0; height: 58%; background: var(--env); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .8s cubic-bezier(.4,0,.2,1); filter: brightness(1.06); z-index: 2; border-radius: 6px 6px 0 0; }
.env__seal { position: absolute; z-index: 3; left: 50%; top: 58%; transform: translate(-50%, -50%); width: 78px; height: 78px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--seal) 70%, #fff) 0%, var(--seal) 45%, color-mix(in srgb, var(--seal) 60%, #000) 100%); display: grid; place-items: center; color: color-mix(in srgb, var(--seal) 25%, #fff); font-family: 'Cinzel', serif; font-size: 20px; letter-spacing: .04em; box-shadow: 0 6px 16px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.25); transition: transform .4s, opacity .4s; }
.env__seal::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; border: 1px dashed currentColor; opacity: .6; }
.env:hover .env__seal { transform: translate(-50%, -50%) scale(1.06); }
.env.is-open .env__seal { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
.env.is-open .env__flap { transform: rotateX(180deg); z-index: 0; }

/* ---- Opener: DOORS ---- */
.doors { width: min(340px, 84vw); aspect-ratio: 3 / 4.2; position: relative; perspective: 1400px; cursor: pointer; border-radius: 999px 999px 6px 6px; background: var(--paper); box-shadow: 0 30px 70px rgba(0,0,0,.5); }
.doors__inner { position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent); font-family: var(--script); font-size: 34px; border-radius: inherit; overflow: hidden; }
.door { position: absolute; top: 0; bottom: 0; width: 50%; background: var(--door); border: 2px solid var(--accent); transition: transform 1.3s cubic-bezier(.6,0,.2,1); backface-visibility: hidden; display: grid; place-items: center; overflow: hidden; }
.door svg { width: 78%; height: auto; color: var(--accent); }
.door--l { left: 0; transform-origin: left; border-radius: 999px 0 0 6px / 999px 0 0 6px; border-right-width: 1px; }
.door--r { right: 0; transform-origin: right; border-radius: 0 999px 6px 0 / 0 999px 6px 0; border-left-width: 1px; }
.door--l { border-top-left-radius: 170px; }
.door--r { border-top-right-radius: 170px; }
.doors__knock { position: absolute; z-index: 3; left: 50%; top: 56%; transform: translate(-50%, -50%); width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--accent); background: var(--door); display: grid; place-items: center; color: var(--accent); font-family: 'Cinzel', serif; font-size: 14px; transition: opacity .3s; }
.doors.is-open .door--l { transform: rotateY(-105deg); }
.doors.is-open .door--r { transform: rotateY(105deg); }
.doors.is-open .doors__knock { opacity: 0; }

/* ---- Opener: SCRATCH ---- */
.scratch { width: min(360px, 88vw); padding: 40px 28px; text-align: center; background: var(--paper); border: 1px solid var(--accent); position: relative; display: grid; gap: 22px; box-shadow: 0 30px 70px rgba(0,0,0,.5); }
.scratch::before { content: ''; position: absolute; inset: 8px; border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); pointer-events: none; }
.scratch__k { font-family: var(--fd); font-size: 14px; letter-spacing: .4em; text-transform: uppercase; color: var(--accent); }
.scratch__n { font-family: var(--fd); font-size: 34px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.15; }
.scratch__n i { display: block; font-family: var(--script); font-style: normal; text-transform: none; color: var(--accent); font-size: 1em; letter-spacing: 0; }
.scratch__area { position: relative; width: 100%; aspect-ratio: 2.2; margin: 0 auto; border-radius: 4px; overflow: hidden; touch-action: none; }
.scratch__under { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 2px; font-family: var(--fd); color: var(--ink); background: color-mix(in srgb, var(--paper) 85%, var(--accent)); }
.scratch__under b { font-size: 40px; font-weight: 400; letter-spacing: .08em; }
.scratch__under span { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); }
.scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; transition: opacity .6s; }
.scratch canvas.is-clear { opacity: 0; pointer-events: none; }
.scratch__skip { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; justify-self: center; padding: 8px; }

/* ---- Opener: GATEFOLD ---- */
.gate { width: min(340px, 84vw); aspect-ratio: 3 / 4.2; position: relative; perspective: 1600px; cursor: pointer; }
.gate__base { position: absolute; inset: 0; background: var(--paper); border-radius: 999px 999px 4px 4px; box-shadow: 0 30px 70px rgba(0,0,0,.45); display: grid; place-items: center; text-align: center; color: var(--accent); font-family: var(--script); font-size: 34px; }
.gate__p { position: absolute; top: 0; bottom: 0; width: 50%; background: var(--panel); transition: transform 1.4s cubic-bezier(.6,0,.2,1); transform-style: preserve-3d; border: 1px solid var(--line); display: grid; place-items: center; }
.gate__p--l { left: 0; transform-origin: left center; border-top-left-radius: 170px; border-bottom-left-radius: 4px; }
.gate__p--r { right: 0; transform-origin: right center; border-top-right-radius: 170px; border-bottom-right-radius: 4px; }
.gate__p::before { content: ''; position: absolute; inset: 10px; border: 1px solid color-mix(in srgb, var(--line) 70%, transparent); border-radius: inherit; }
.gate__p--l::before { border-right: 0; }
.gate__p--r::before { border-left: 0; }
.gate__band { position: absolute; z-index: 3; left: 0; right: 0; top: 54%; height: 52px; background: var(--paper); display: grid; place-items: center; font-family: 'Cinzel', serif; letter-spacing: .3em; font-size: 13px; color: var(--ink); box-shadow: 0 4px 12px rgba(0,0,0,.2); transition: opacity .4s, transform .5s; }
.gate.is-open .gate__band { opacity: 0; transform: scaleX(1.2); }
.gate.is-open .gate__p--l { transform: rotateY(-160deg); }
.gate.is-open .gate__p--r { transform: rotateY(160deg); }

/* ---- STORIES ---- */
.stories { width: min(400px, 100%); aspect-ratio: 9 / 16; max-height: calc(100dvh - 120px); position: relative; border-radius: 18px; overflow: hidden; background: #1a1714; color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.5); user-select: none; -webkit-user-select: none; }
@supports not (height: 100dvh) { .stories { max-height: calc(100vh - 120px); } }
.stories__bars { position: absolute; z-index: 5; top: 12px; left: 12px; right: 12px; display: flex; gap: 4px; }
.stories__bars i { flex: 1; height: 2.5px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
.stories__bars i b { display: block; height: 100%; width: 0; background: #fff; }
.stories__bars i.done b { width: 100%; }
.stories__bars i.run b { animation: fillbar var(--dur, 5s) linear forwards; }
.stories.is-paused .stories__bars i.run b { animation-play-state: paused; }
@keyframes fillbar { to { width: 100%; } }
.stories__head { position: absolute; z-index: 5; top: 24px; left: 14px; right: 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #fff; }
.stories__head img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1.5px solid #fff; }
.stories__head span { opacity: .7; }
.slide { isolation: isolate; position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; text-align: center; padding: 80px 28px 72px; gap: 20px; opacity: 0; transition: opacity .5s; pointer-events: none; }
.slide.is-on { opacity: 1; pointer-events: auto; }
.slide > * { transform: translateY(14px); opacity: 0; transition: transform .7s ease, opacity .7s ease; }
.slide.is-on > * { transform: none; opacity: 1; }
.slide.is-on > *:nth-child(2) { transition-delay: .15s; } .slide.is-on > *:nth-child(3) { transition-delay: .3s; } .slide.is-on > *:nth-child(4) { transition-delay: .45s; } .slide.is-on > *:nth-child(5) { transition-delay: .6s; }
.slide__bg { position: absolute !important; inset: 0; z-index: -1; opacity: 1 !important; transform: none !important; }
.slide__bg img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.7) brightness(.55); }
.slide__k { font-size: 11px; letter-spacing: .34em; text-transform: uppercase; color: var(--accent); }
.slide__t { font-family: var(--fd); font-size: 44px; line-height: 1.05; font-weight: 400; }
.slide__t i { font-family: var(--script); font-style: normal; color: var(--accent); display: block; font-size: .9em; }
.slide__p { font-family: var(--fs); font-size: 21px; line-height: 1.45; color: var(--muted); max-width: 300px; }
.slide__list { display: grid; gap: 0; width: 100%; text-align: left; }
.slide__list div { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 14px; }
.slide__list time { color: var(--accent); font-size: 12px; letter-spacing: .06em; padding-top: 2px; }
.slide__list b { font-family: var(--fs); font-weight: 500; font-size: 19px; display: block; line-height: 1.2; }
.slide__list span { color: var(--muted); font-size: 13px; }
.slide .p-btn { border-color: var(--accent); color: var(--accent); width: 100%; }
.slide .p-btn--solid { background: var(--accent); color: #1a1714; }
.stories__tap { position: absolute; z-index: 4; top: 60px; bottom: 0; width: 34%; }
.stories__tap--prev { left: 0; } .stories__tap--next { right: 0; width: 66%; }
.slide.is-on .p-actions { position: relative; z-index: 6; }
.stories__cover { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; align-content: center; gap: 18px; text-align: center; background: linear-gradient(180deg, rgba(20,18,16,.2), rgba(20,18,16,.85)); cursor: pointer; transition: opacity .5s; }
.stories__cover.is-gone { opacity: 0; pointer-events: none; }
.stories__cover img.bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; filter: saturate(.75) brightness(.7); }
.play { width: 72px; height: 72px; border-radius: 50%; border: 1.5px solid #fff; display: grid; place-items: center; color: #fff; }
.play .ico { width: 26px; height: 26px; margin-left: 4px; fill: #fff; }

/* sparkle burst on open */
.burst { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
.burst i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0; animation: burst 1.6s ease-out forwards; }
@keyframes burst { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(.4); } }

/* =========================================================================
   ORIGINAL — The Sacred Thread (website)
   ========================================================================= */
.site[data-theme="thread"] { --tx: 10px; position: relative; }
@media (min-width: 1024px) { .site[data-theme="thread"] { --tx: max(28px, calc(50% - 600px)); } }
.thread { position: absolute; z-index: 1; top: 0; bottom: 0; left: var(--tx); width: 3px; pointer-events: none; }
.thread__track { position: absolute; inset: 0; background: repeating-linear-gradient(180deg, var(--line) 0 6px, transparent 6px 10px); width: 1px; left: 1px; }
.thread__fill { position: absolute; left: 0; top: 0; width: 3px; height: 0; border-radius: 3px; background: repeating-linear-gradient(160deg, var(--accent) 0 7px, var(--accent2) 7px 9px); box-shadow: 0 0 0 .5px rgba(0,0,0,.05); }
.knot { position: absolute; z-index: 2; left: calc(var(--tx) - 7.5px); width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg); transition: border-color .5s, background .5s, transform .5s; pointer-events: none; }
.knot::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--accent2); transform: scale(0); transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
.knot.tied { border-color: var(--accent); transform: rotate(45deg); }
.knot.tied::after { transform: scale(1); }
.sec--alt .knot { background: var(--alt); }
.hero--thread .hero__in { justify-items: center; text-align: center; gap: 26px; }
.hero--thread .tk { width: min(260px, 60vw); color: var(--accent); }
.hero--thread .hero__names { font-size: clamp(54px, 11vw, 128px); font-weight: 400; line-height: .95; }
.hero--thread .hero__names span { display: block; }
.hero--thread .hero__names .amp { font-size: .5em; display: block; margin: .1em 0; }
.hero--thread .mini-por { width: 92px; height: 92px; border-radius: 50%; overflow: hidden; border: 1px solid var(--line); padding: 3px; }
.hero--thread .mini-por img { border-radius: 50%; width: 100%; height: 100%; object-fit: cover; }
.site[data-theme="thread"] .ev { border-left: 2px solid var(--accent); }

/* =========================================================================
   ORIGINAL — Boarding Pass (website)
   ========================================================================= */
.hero--pass .hero__in { gap: 32px; justify-items: center; text-align: center; }
.hero--pass .pass-k { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; opacity: .8; display: flex; align-items: center; gap: 10px; }
.bpass { width: min(860px, 100%); background: #fbfaf7; color: #14202b; border-radius: 16px; display: grid; text-align: left; box-shadow: 0 30px 80px rgba(0,0,0,.35); overflow: hidden; }
.bpass__main { padding: 28px 24px; display: grid; gap: 22px; }
.bpass__air { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #5f6b75; }
.bpass__air b { color: #c4472c; font-weight: 600; letter-spacing: .14em; }
.bpass__route { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.bpass__route div:last-child { text-align: right; }
.bpass__code { font-family: 'Space Grotesk', sans-serif; font-size: clamp(40px, 9vw, 72px); font-weight: 500; line-height: 1; letter-spacing: -.01em; }
.bpass__city { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #5f6b75; margin-top: 6px; }
.bpass__plane { display: grid; justify-items: center; color: #c4472c; }
.bpass__plane .ico { width: 30px; height: 30px; }
.bpass__plane span { width: clamp(40px, 10vw, 120px); border-top: 1.5px dashed #c5c0b5; margin-top: 6px; }
.bpass__names { font-family: 'Space Grotesk', sans-serif; font-size: clamp(22px, 4vw, 30px); font-weight: 500; text-transform: uppercase; letter-spacing: .02em; padding-top: 18px; border-top: 1px solid #e6e2d9; }
.bpass__names small { display: block; font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: .22em; color: #5f6b75; margin-bottom: 4px; font-weight: 400; }
.bpass__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 20px; }
@media (min-width: 640px) { .bpass__grid { grid-template-columns: repeat(4, 1fr); } }
.bpass__grid small { display: block; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: #5f6b75; margin-bottom: 4px; }
.bpass__grid b { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 500; line-height: 1.25; }
.bpass__stub { position: relative; padding: 24px; display: grid; gap: 16px; justify-items: center; text-align: center; background: #f1eee7; border-top: 2px dashed #cfcabe; }
.bpass__stub img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
.barcode { width: 100%; max-width: 220px; height: 54px; background: repeating-linear-gradient(90deg, #14202b 0 2px, transparent 2px 4px, #14202b 4px 5px, transparent 5px 8px, #14202b 8px 11px, transparent 11px 12px); }
.bpass__stub small { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: #5f6b75; }
@media (min-width: 760px) { .bpass { grid-template-columns: 1fr 230px; } .bpass__main { padding: 36px 40px; } .bpass__stub { border-top: 0; border-left: 2px dashed #cfcabe; align-content: center; }
  .bpass__stub::before, .bpass__stub::after { content: ''; position: absolute; left: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--heroBg); }
  .bpass__stub::before { top: -12px; } .bpass__stub::after { bottom: -12px; } }
.site[data-theme="boarding"] .ev__time { font-family: 'Space Grotesk', sans-serif; font-size: 26px; letter-spacing: 0; color: var(--ink); }
.site[data-theme="boarding"] .ev__top::after { content: attr(data-gate); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #fff; background: var(--accent2); padding: 4px 10px; border-radius: 4px; white-space: nowrap; }
.site[data-theme="boarding"] .ev__hi { display: none; }
.site[data-theme="boarding"] .ev h3 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; }
.site[data-theme="boarding"] .eyebrow { color: var(--accent); }
.site[data-theme="boarding"] .s-nav__mono { font-family: 'Space Grotesk', sans-serif; font-size: 18px; }

/* =========================================================================
   ORIGINAL — Mehendi Reveal + Light the Diya (cards)
   ========================================================================= */
.mehendi { width: min(340px, 84vw); aspect-ratio: 1; border-radius: 50%; background: var(--paper); box-shadow: 0 30px 70px rgba(80,40,10,.25); display: grid; place-items: center; cursor: pointer; position: relative; }
.mehendi svg { width: 86%; height: 86%; color: var(--accent); }
.mehendi path, .mehendi circle { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.mehendi .ghost { stroke-opacity: .14; }
.mehendi .ink { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); }
.mehendi.is-drawing .ink { animation: draw 2.6s cubic-bezier(.5,0,.3,1) forwards; animation-delay: var(--d, 0s); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.mehendi__names { position: absolute; font-family: var(--script); font-size: 30px; color: var(--accent); opacity: 0; transition: opacity 1s 2.2s; background: var(--paper); padding: 4px 14px; border-radius: 999px; }
.mehendi.is-drawing .mehendi__names { opacity: 1; }

.diya-stage { display: grid; justify-items: center; gap: 8px; cursor: pointer; }
.diya-svg { width: 240px; height: auto; overflow: visible; }
.diya-svg .flame { transform-origin: 90px 74px; transform: scale(0); transition: transform .6s cubic-bezier(.3,1.5,.5,1); }
.diya-svg.is-lit .flame { transform: scale(1); animation: flicker 1.4s ease-in-out infinite .6s; }
@keyframes flicker { 0%,100% { transform: scale(1) rotate(-1deg); } 50% { transform: scale(1.06, .95) rotate(2deg); } }
.diya-glow { position: fixed; inset: 0; pointer-events: none; z-index: 30; background: #0b0907; -webkit-mask-image: radial-gradient(circle at 50% var(--gy, 50%), transparent var(--r, 0px), #000 calc(var(--r, 0px) + 140px)); mask-image: radial-gradient(circle at 50% var(--gy, 50%), transparent var(--r, 0px), #000 calc(var(--r, 0px) + 140px)); }
.diya-warm { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(circle at 50% 30%, rgba(240,180,76,.16), transparent 60%); opacity: 0; transition: opacity 2s; }
.diya-warm.on { opacity: 1; }
.diya-names { font-family: var(--script); color: var(--accent); font-size: 30px; opacity: .85; }
.hero--split { background-color: var(--heroBg); background-image: var(--pat); }
.hero .eyebrow { color: var(--heroAccent, var(--accent)); }
.hero .btn--solid { background: var(--heroBtn, var(--accent)); color: var(--heroBtnInk, #fff); }
.s-foot .btn--solid { background: var(--heroBtn, var(--accent)); color: var(--heroBtnInk, #fff); }

/* =========================================================================
   STRUCTURAL VARIANTS — section heads, dividers, story, events
   ========================================================================= */
.sec__head--left { text-align: left; justify-items: stretch; grid-template-columns: auto 1fr; gap: 20px 28px; align-items: start; padding-top: 20px; border-top: 1px solid var(--ink); }
.sec__head--left > div { display: grid; gap: 12px; }
.sec__head--left .sec__lead { max-width: 560px; }
.sec__idx { font-family: var(--fd); font-size: clamp(28px, 4vw, 40px); line-height: 1; color: var(--accent); min-width: 2ch; }
.site[data-div="scallop"] .sec--alt::before { content: ''; position: absolute; left: 0; right: 0; top: -15px; height: 16px; background: radial-gradient(circle at 15px 16px, var(--alt) 14px, transparent 15px) 0 0 / 30px 16px repeat-x; }
.site[data-div="scallop"] .sec--alt::after { content: ''; position: absolute; left: 0; right: 0; bottom: -15px; height: 16px; background: radial-gradient(circle at 15px 0, var(--alt) 14px, transparent 15px) 0 0 / 30px 16px repeat-x; z-index: 1; }
.site[data-div="wave"] .sec--alt::before { content: ''; position: absolute; left: 0; right: 0; top: -39px; height: 40px; background: var(--wave) center / 100% 100% no-repeat; }

/* story: chapters */
.stC { display: grid; gap: 40px; }
@media (min-width: 900px) { .stC { grid-template-columns: repeat(3, 1fr); gap: 48px; } }
.stC__n { font-family: var(--fd); font-size: clamp(64px, 8vw, 96px); line-height: 1; color: var(--accent); opacity: .9; margin-bottom: 12px; }
.stC__i h3 { font-family: var(--fs); font-size: 26px; font-weight: 500; line-height: 1.25; margin-bottom: 10px; }
.stC__i p { color: var(--muted); }
.stC__i { padding-top: 20px; border-top: 1px solid var(--line); }
/* story: cards */
.stK { display: grid; gap: 20px; }
@media (min-width: 900px) { .stK { grid-template-columns: repeat(3, 1fr); gap: 24px; } }
.stK__i { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px 28px; display: grid; gap: 12px; align-content: start; }
.stK__y { justify-self: start; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 4px 10px; border-radius: 999px; }
.stK__i h3 { font-family: var(--fs); font-size: 26px; font-weight: 500; line-height: 1.25; }
.stK__i p { color: var(--muted); font-size: 15px; }
.site[data-theme="boarding"] .stK__y { border-style: dashed; border-radius: 4px; font-family: 'Space Grotesk', sans-serif; }

.evA__meta { display: grid; gap: 6px; font-size: 14px; color: var(--ink); }
.evA__meta span { display: flex; gap: 8px; align-items: flex-start; }
.evA__meta .ico { width: 16px; height: 16px; margin-top: 3px; color: var(--accent); }

/* events: ARCHES (Rajwada) */
.evA { display: grid; gap: 24px; }
@media (min-width: 720px) { .evA { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1080px) { .evA { grid-template-columns: repeat(3, 1fr); } }
.evA__i { background: var(--surface); border: 1px solid var(--line); border-radius: 999px 999px var(--radius) var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.evA__top { background: var(--heroBg); color: var(--heroInk); padding: 56px 24px 26px; display: grid; justify-items: center; gap: 4px; text-align: center; border-bottom: 3px solid var(--accent2); }
.evA__hi { font-family: 'Tiro Devanagari Hindi', serif; font-size: 34px; line-height: 1.2; color: var(--heroAccent, var(--accent2)); }
.evA__en { font-family: var(--fd); font-size: 14px; letter-spacing: .26em; text-transform: uppercase; }
.evA__t { font-size: 12px; letter-spacing: .2em; opacity: .8; margin-top: 6px; }
.evA__body { padding: 24px; display: flex; flex-direction: column; gap: 14px; flex: 1; text-align: center; }
.evA__body h3 { font-family: var(--fs); font-size: 24px; font-weight: 500; line-height: 1.25; }
.evA__body p { color: var(--muted); font-size: 15px; }
.evA__body .evA__meta { justify-items: center; padding-top: 14px; border-top: 1px solid var(--line); }
.evA__body .ev__actions { justify-content: center; margin-top: auto; }

/* events: TABLE (Editorial) */
.evT { border-top: 1px solid var(--ink); }
.evT__r { display: grid; gap: 12px 28px; padding: 28px 0; border-bottom: 1px solid var(--line); grid-template-columns: auto 1fr; }
.evT__n { font-size: 12px; letter-spacing: .2em; color: var(--muted); padding-top: 10px; }
.evT__time { font-family: var(--fd); font-size: clamp(34px, 4vw, 48px); line-height: 1; white-space: nowrap; }
.evT__time small { display: block; font-family: var(--fb); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.evT__main, .evT__side { grid-column: 1 / -1; }
.evT__main h3 { font-family: var(--fs); font-size: clamp(24px, 2.6vw, 30px); font-weight: 500; line-height: 1.2; margin-bottom: 8px; }
.evT__main p { color: var(--muted); font-size: 15px; max-width: 520px; }
.evT__side { display: grid; gap: 12px; font-size: 14px; }
.evT__side small { display: block; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.evT__side span { color: var(--muted); }
.evT__links { display: flex; gap: 18px; flex-wrap: wrap; }
.lnk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px; color: var(--accent); }
.lnk .ico { width: 15px; height: 15px; }
@media (min-width: 960px) { .evT__r { grid-template-columns: 40px 190px 1.3fr 1fr; } .evT__main, .evT__side { grid-column: auto; } }

/* events: WINDOWS carousel (Pink City) */
.evW { margin: 0 -20px; }
@media (min-width: 768px) { .evW { margin: 0 -40px; } }
.evW__track { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 8px 20px 24px; scrollbar-width: none; scroll-padding: 0 20px; }
.evW__track::-webkit-scrollbar { display: none; }
@media (min-width: 768px) { .evW__track { padding: 8px 40px 24px; scroll-padding: 0 40px; } }
.evW__i { flex: 0 0 min(300px, 82vw); scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 999px 999px var(--radius) var(--radius); display: flex; flex-direction: column; overflow: hidden; }
.evW__arch { position: relative; height: 230px; background: var(--accent); background-image: var(--pat); color: #fff; display: grid; place-items: center; align-content: center; gap: 6px; text-align: center; border-radius: 999px 999px 0 0; margin: 10px 10px 0; }
.evW__num { font-family: var(--fs); font-style: italic; font-size: 20px; opacity: .85; }
.evW__name { font-family: var(--fd); font-size: 40px; line-height: 1; }
.evW__time { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; }
.evW__body { padding: 22px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.evW__body h3 { font-family: var(--fs); font-size: 23px; font-weight: 500; line-height: 1.25; }
.evW__body p { color: var(--muted); font-size: 15px; }

.lt__arch { width: 170px; aspect-ratio: 3 / 4; border-radius: 999px 999px 10px 10px; overflow: hidden; border: 3px solid #c9a05a; box-shadow: 0 0 0 6px var(--paper), 0 0 0 7px #d6b57a; margin: 14px 0 6px; }
.lt__arch img { width: 100%; height: 100%; object-fit: cover; }
.lt__small { font-style: italic; font-size: 19px; color: var(--muted); max-width: 300px; }
.lt__names { font-family: 'Great Vibes', cursive; font-size: clamp(56px, 16vw, 76px); line-height: .95; color: #5a1a14; display: grid; }
.lt__names span { font-size: .55em; color: var(--accent); }
.lt__pill { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; padding: 12px 20px; border: 1px solid #c9a05a; border-radius: 999px; }
.lt__caps { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); }
.lt__caps.light { color: #ffe9c4; }
.lt__par { display: grid; gap: 4px; font-size: 20px; line-height: 1.35; }
.lt__par span { font-size: 15px; font-style: italic; color: var(--muted); }
.lt__par b { font-weight: 600; }
.lt__amp { font-family: 'Great Vibes', cursive; font-size: 36px; color: var(--accent); line-height: 1; }
.lt__kalash { width: 100%; max-width: 380px; margin-top: 8px; }
.lt__kalash svg { width: 100%; height: auto; display: block; }
.lt--wed { background: linear-gradient(180deg, #7b3a6a 0%, #c55a55 40%, #e98a5a 100%); color: #fff; padding-bottom: 0; }
.lt__script { font-family: 'Great Vibes', cursive; font-size: clamp(64px, 18vw, 88px); line-height: .9; color: #ffe2b0; text-shadow: 0 2px 16px rgba(80,20,30,.3); }
.lt__script.dark { color: #5a1a14; text-shadow: none; }
.lt__venue { font-family: 'Cinzel', serif; font-size: 20px; letter-spacing: .1em; text-transform: uppercase; }
.lt__mandap { width: calc(100% + 56px); margin: 10px -28px 0; aspect-ratio: 4 / 3; }
@media (min-width: 440px) { .lt__mandap { width: calc(100% + 88px); margin: 10px -44px 0; } }
.lt__mandap svg { width: 100%; height: 100%; display: block; }
.lt--cel { padding-top: 72px; }
.lt__evs { display: grid; gap: 0; width: 100%; max-width: 380px; margin-top: 8px; }
.lt__ev { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; text-align: left; padding: 16px 0; border-bottom: 1px dashed var(--line); }
.lt__ev:last-child { border-bottom: 0; }
.lt__ico { width: 64px; height: 64px; border-radius: 50%; background: #f6ead6; display: grid; place-items: center; }
.lt__ico svg { width: 46px; height: 46px; }
.lt__evn { font-family: 'Great Vibes', cursive; font-size: 34px; line-height: 1; color: #5a1a14; }
.lt__evt { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin-top: 6px; }
.lt__evv { font-size: 16px; color: var(--muted); font-style: italic; }
.lt--venue .p-actions { width: 100%; max-width: 340px; }
.lt__vn { font-family: 'Cinzel', serif; font-size: 24px; letter-spacing: .1em; text-transform: uppercase; }
.lt__addr { font-size: 17px; color: var(--muted); max-width: 300px; }
.lt__loc { background: #7c3f2c !important; border-color: #7c3f2c !important; color: #fff !important; border-radius: 999px; }
.lotus .p-btn { border-radius: 999px; }
.drawer__step { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.couple__met { font-family: var(--fs); font-style: italic; font-size: clamp(21px, 2.4vw, 26px); line-height: 1.45; color: var(--ink); padding-top: 8px; }

</style>

const ILL = (() => {
  let n = 0; const uid = (p) => `${p}${++n}`;

  // soft watercolour edge filter
  const wc = (id, scale = 5) => `<filter id="${id}" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="${scale}"/></filter>`;

  function rambagh() {
    const f = uid('wc'), sky = uid('sk');
    const arches = Array.from({ length: 9 }, (_, i) => { const x = 210 + i * 42; const big = i === 4; return `<path d="M${x} 262V${big ? 205 : 214}q${big ? 18 : 14}-${big ? 26 : 20} ${big ? 36 : 28} 0V262z" fill="#8e5a3c" opacity=".55"/>`; }).join('');
    const jharokhas = Array.from({ length: 9 }, (_, i) => `<rect x="${214 + i * 42}" y="176" width="20" height="14" rx="7" fill="#b07a55" opacity=".5"/>`).join('');
    const cypress = (x, h) => `<path d="M${x} 270c-9-30-9-${h}-0-${h + 30}c9 ${h} 9 ${h - 30} 0 ${h + 30}z" fill="#4f6f52" opacity=".75"/>`;
    const bush = (x, y, c, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity=".55"/>`;
    return `<svg viewBox="0 0 800 340" role="img" aria-label="Watercolour illustration of Rambagh Palace" preserveAspectRatio="xMidYMid slice">
      <defs>${wc(f, 6)}<linearGradient id="${sky}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e3cf"/><stop offset=".7" stop-color="#fbf1e6"/><stop offset="1" stop-color="#f2e6d3"/></linearGradient></defs>
      <rect width="800" height="340" fill="url(#${sky})"/>
      <g filter="url(#${f})">
        <circle cx="610" cy="90" r="46" fill="#f7c873" opacity=".35"/>
        <path d="M60 60c40-12 90-10 120 4M520 50c50-14 110-8 140 8" stroke="#e8cdb5" stroke-width="10" stroke-linecap="round" opacity=".6" fill="none"/>
        <rect x="190" y="160" width="420" height="104" fill="#e9c3a2" opacity=".85"/>
        <rect x="270" y="120" width="260" height="42" fill="#f0d6bd" opacity=".9"/>
        <path d="M372 122q28-56 56 0z" fill="#d6a17c"/><circle cx="400" cy="70" r="3" fill="#a46a46"/>
        <path d="M284 122q18-36 36 0zM480 122q18-36 36 0zM198 162q16-30 32 0zM570 162q16-30 32 0z" fill="#d6a17c" opacity=".95"/>
        <rect x="190" y="156" width="420" height="6" fill="#c48b66" opacity=".6"/>
        ${jharokhas}${arches}
        ${cypress(150, 70)}${cypress(650, 70)}${cypress(120, 50)}${cypress(680, 50)}
        ${bush(80, 262, '#6d9070', 40)}${bush(130, 272, '#d9627a', 26)}${bush(720, 262, '#6d9070', 40)}${bush(670, 272, '#d9627a', 26)}${bush(40, 280, '#86a789', 34)}${bush(760, 280, '#86a789', 34)}
        <rect x="0" y="262" width="800" height="78" fill="#a7c19d" opacity=".75"/>
        <path d="M352 262h96l60 78H292z" fill="#bcd9de" opacity=".9"/>
        <path d="M400 262v78" stroke="#fff" stroke-width="2" opacity=".6"/>
        ${bush(250, 300, '#f2a7b5', 14)}${bush(550, 300, '#f2a7b5', 14)}${bush(200, 318, '#f6d06b', 10)}${bush(600, 318, '#f6d06b', 10)}
      </g></svg>`;
  }

  function nahargarh() {
    const s = uid('ns');
    return `<svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sunset over Nahargarh Fort and Jaipur">
      <defs><linearGradient id="${s}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b4a7a"/><stop offset=".4" stop-color="#d9786a"/><stop offset=".7" stop-color="#f4b26a"/><stop offset="1" stop-color="#f8d79a"/></linearGradient></defs>

    const w = []; for (let r = 0; r < 6; r++) { const cols = 9 - Math.floor(r / 1.5); for (let c = 0; c < cols; c++) { const x = 300 - (cols * 30) / 2 + c * 30 + 6; const y = 330 - r * 44; w.push(`<path d="M${x} ${y}v-20q9-12 18 0v20z" fill="#7d2f2a" opacity=".55"/><rect x="${x - 2}" y="${y}" width="22" height="3" fill="#f6d2b8" opacity=".7"/>`); } }

      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
      o.connect(g); o2.connect(g); g.connect(audioCtx.destination); o.start(t); o2.start(t); o.stop(t + 1.7); o2.stop(t + 1.7);
    });
  } catch (e) {}
}

const params = new URLSearchParams(location.search);
const GUEST = params.get('guest') === '1';
const app = { route: { type: 'home' }, cleanup: [] };
const allItems = () => [...ACTIVE_SITES.map((s) => ({ type: 'site', item: s })), ...ACTIVE_CARDS.map((c) => ({ type: 'card', item: c }))];
const findSite = (id) => SITES.find((s) => s.id === id);
const findCard = (id) => CARDS.find((c) => c.id === id);

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const [type, id] = h.split('/');
  if (type === 'site' && findSite(id)) return { type: 'site', id };
  if (type === 'card' && findCard(id)) return { type: 'card', id };
  // legacy links: ?theme=rajwada
  const legacy = params.get('theme');
  if (!h && legacy && findSite(legacy)) return { type: 'site', id: legacy };
  if (GUEST) return { type: 'site', id: ACTIVE_SITES[0].id };
  return { type: 'home' };
}
const go = (type, id) => { location.hash = type === 'home' ? '#/' : `#/${type}/${id}`; };
function guestLink(r = app.route) { const base = location.origin + location.pathname; return r.type === 'home' ? base : `${base}?guest=1#/${r.type}/${r.id}`; }

function render() {
  app.cleanup.forEach((fn) => { try { fn(); } catch (e) {} }); app.cleanup = [];
  app.route = parseRoute();
  closeDrawer();
  $$('.view').forEach((v) => v.classList.remove('is-active'));
  document.body.classList.remove('no-scroll');
  const pill = $('#pill');
  if (app.route.type === 'home') { renderStudio(); $('#studio').classList.add('is-active'); pill.hidden = true; document.title = 'Yogesh & Nikita — Wedding Design Studio'; }
  else if (app.route.type === 'site') { renderSite(findSite(app.route.id)); $('#siteView').classList.add('is-active'); pill.hidden = GUEST; }
  else { renderCard(findCard(app.route.id)); $('#cardView').classList.add('is-active'); pill.hidden = GUEST; }
  renderDrawer();
  const html = document.documentElement; html.style.scrollBehavior = 'auto'; window.scrollTo(0, 0); html.style.scrollBehavior = '';
  window.dispatchEvent(new Event('scroll'));
  tick();
}
window.addEventListener('hashchange', render);
