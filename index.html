function renderSite(s) {
  const root = $('#siteView');
  root.className = 'view site';
  root.setAttribute('data-theme', s.id);
  root.toggleAttribute('data-dark', !!s.dark);
  root.toggleAttribute('data-script', !!s.v.script);
  const LY = LAYOUT[s.id] || {}; if (LY.divider) root.setAttribute('data-div', LY.divider); else root.removeAttribute('data-div');
  root.removeAttribute('style');
  Object.entries(VAR_MAP).forEach(([k, css]) => { if (s.v[k] != null) root.style.setProperty(css, s.v[k]); });
  root.style.setProperty('--pat', PATTERNS[s.pattern[0]](s.pattern[1]));
  root.style.setProperty('--wave', svgUrl(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 40' preserveAspectRatio='none'><path d='M0 40V22C240 0 480 0 720 18s480 22 720 0v22z' fill='${s.v.alt}'/></svg>`));
  NAV = s.id === 'editorial' ? NAV_LOVE : NAV_DEFAULT;
  root.innerHTML = s.id === 'editorial' ? loveHTML(s) : siteHTML(s);
  const clock = $('[data-clock]', root);
  if (clock) { const upd = () => { clock.textContent = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' }) + ' IST'; }; upd(); const ci = setInterval(upd, 15000); app.cleanup.push(() => clearInterval(ci)); }
  document.title = `${CONFIG.groom} & ${CONFIG.bride} — ${CONFIG.dateShort}`;

  // in-page jumps (hash is used for routing, so scroll manually)
  root.addEventListener('click', onSiteClick);
  app.cleanup.push(() => root.removeEventListener('click', onSiteClick));

  // nav solid + scroll spy + mobile rsvp + thread
  const nav = $('#sNav'), mR = $('#mRsvp'), rsvp = $('#rsvp');
  const secs = NAV.map(([id]) => $('#' + id));
  const fill = $('#threadFill');
  let knots = [];
  if (fill) {
    knots = $$('.sec', root).map((sec) => { const k = document.createElement('span'); k.className = 'knot'; sec.appendChild(k); const h = $('.sec__head, .intro', sec); k.style.top = (h ? h.offsetTop + 8 : 80) + 'px'; return k; });
  }
  const onScroll = () => {
    const y = window.scrollY;
    nav.classList.toggle('is-solid', y > 40);
    const r = rsvp.getBoundingClientRect();
    mR.classList.toggle('is-hidden', y < 300 || (r.top < innerHeight && r.bottom > 0));
    let here = null; secs.forEach((sec) => { if (sec && sec.getBoundingClientRect().top < innerHeight * 0.35) here = sec.id; });
    $$('.s-nav__links a').forEach((a) => a.classList.toggle('is-here', a.getAttribute('href') === '#' + here));
    if (fill) {
      const max = root.scrollHeight; const pos = Math.min(max, y + innerHeight * 0.6);
      fill.style.height = pos + 'px';
      knots.forEach((k) => { const top = k.getBoundingClientRect().top + y; k.classList.toggle('tied', top < pos); });
    }
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  app.cleanup.push(() => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); });
  onScroll();

  // mobile site menu
  const menu = $('#sMenu');
  $('[data-smenu]', root).addEventListener('click', () => { menu.classList.add('is-open'); menu.setAttribute('aria-hidden', 'false'); document.body.classList.add('no-scroll'); });
  $('[data-smenu-close]', root).addEventListener('click', () => closeSiteMenu());

  // venues
  const showVenue = (k) => {
    const v = VENUES[k];
    $$('.venue-tab', root).forEach((b) => b.setAttribute('aria-selected', b.dataset.venue === k));
    $('#venueCard').innerHTML = `<div class="venue-map"><div class="venue-map__load"><div>${I('pin')}<br>${v.area}</div><button class="btn btn--ghost btn--sm" data-loadmap="${esc(v.q)}">Show interactive map</button></div></div>
      <div class="venue-info"><div class="eyebrow">${v.role}</div><h3>${v.name}</h3><p>${v.note}</p><p>${v.address} · ${v.drive}</p>
      <div class="row"><a class="btn btn--solid btn--sm" href="${mapsUrl(v.q)}" target="_blank" rel="noopener">${I('pin')} Directions</a><a class="btn btn--ghost btn--sm" href="tel:${v.phone.replace(/\s/g, '')}">Call venue</a><a class="btn btn--ghost btn--sm" href="${v.web}" target="_blank" rel="noopener">${I('globe')} Website</a></div></div>`;
  };
  $$('.venue-tab', root).forEach((b) => b.addEventListener('click', () => showVenue(b.dataset.venue)));
  if ($('#venueCard')) showVenue(Object.keys(VENUES)[0]);

  // rsvp + blessings
  const wall = $('#wall');
  const paintWall = () => { const mine = store.get('yn-bless', []); const all = [...mine, ...BLESSINGS_SEED].slice(0, 6); wall.innerHTML = all.length ? all.map((b) => `<div class="bless"><p>“${esc(b.text)}”</p><div><b>${esc(b.name)}</b> · ${esc(b.side)}</div></div>`).join('') : '<div class="bless"><p>Be the first to leave a blessing for the couple — add one with your RSVP.</p></div>'; };
  paintWall();
  const form = $('#rsvpForm');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(form));
    if (!d.name.trim()) { $('#f-name').focus(); toast('Please add your name'); return; }
    store.set('yn-rsvp', d);
    if (d.msg.trim()) { const mine = store.get('yn-bless', []); mine.unshift({ name: d.name, side: d.side, text: d.msg }); store.set('yn-bless', mine.slice(0, 5)); paintWall(); }
    const text = `RSVP — ${CONFIG.groom} & ${CONFIG.bride}, 12 Dec 2026\nName: ${d.name}\nPhone: ${d.phone || '-'}\nResponse: ${d.attend}\nWith: ${d.side}\nGuests: ${d.count}\nMeal: ${d.meal}\nArrival: ${d.arrival}${d.msg ? `\nBlessing: ${d.msg}` : ''}`;
    $('#okText').textContent = d.attend.startsWith('Joy') ? `We can’t wait to celebrate with you, ${d.name.split(' ')[0]}. Tap below to send your RSVP to the family on WhatsApp.` : `We’ll miss you, ${d.name.split(' ')[0]}. Tap below to let the family know.`;
    $('#okWa').href = waUrl(text);
    form.classList.add('is-done');
  });
  $('#okEdit').addEventListener('click', () => form.classList.remove('is-done'));

  if (s.id === 'editorial') initLove(root);
  // reveal
  revealAll(root);
}
function closeSiteMenu() { const m = $('#sMenu'); if (!m) return; m.classList.remove('is-open'); m.setAttribute('aria-hidden', 'true'); document.body.classList.remove('no-scroll'); }
function onSiteClick(e) {
  const j = e.target.closest('[data-jump]');
  if (j) { e.preventDefault(); closeSiteMenu(); const t = $(j.getAttribute('href')); if (t) { const y = t.getBoundingClientRect().top + scrollY - (t.id === 'top' ? 80 : 60); window.scrollTo({ top: Math.max(0, y), behavior: REDUCED ? 'auto' : 'smooth' }); } return; }
  if (e.target.closest('[data-ics]')) { downloadICS(); return; }
  const es = e.target.closest('[data-evscroll]');
  if (es) { const t = $('#evTrack'); t.scrollBy({ left: Number(es.dataset.evscroll) * (t.firstElementChild.offsetWidth + 20), behavior: 'smooth' }); return; }
  const lm = e.target.closest('[data-loadmap]');
  if (lm) { lm.closest('.venue-map').innerHTML = `<iframe title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent(lm.dataset.loadmap)}&z=15&output=embed"></iframe>`; }
}
function revealAll(root) {
  const els = $$('.rv', root);
  if (REDUCED || !('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('in')); return; }
  const io = new IntersectionObserver((ents) => ents.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
  els.forEach((e) => io.observe(e));
  app.cleanup.push(() => io.disconnect());
}

function initLove(root) {
  // splash (once per session)
  const sp = $('#splash'); let seen = false; try { seen = sessionStorage.getItem('yn-splash') === '1'; } catch (e) {}
  if (seen) sp.remove(); else { document.body.classList.add('no-scroll');
    $('#splashBtn').addEventListener('click', () => { sp.classList.add('is-gone'); document.body.classList.remove('no-scroll'); try { sessionStorage.setItem('yn-splash', '1'); } catch (e) {} chime(); setTimeout(() => { sp.remove(); $('.collage').classList.add('in'); }, 700); }); }
  if (seen) requestAnimationFrame(() => $('.collage').classList.add('in'));
  app.cleanup.push(() => document.body.classList.remove('no-scroll'));

  // story stack + chapters
  const cards = $$('.stack__card', root); let order = cards.map((_, i) => i); let ch = 0;
  const layout = () => order.forEach((ci, pos) => { const c = cards[ci]; c.style.zIndex = 10 - pos; c.style.transform = `translate(${pos * 10}px, ${pos * -12}px) rotate(${[-2.5, 3, -5][pos] || 0}deg)`; c.style.opacity = pos > 2 ? 0 : 1; });
  const setCh = (i) => { ch = i; $('#lsYear').textContent = STORY[i].year; $('#lsTitle').textContent = STORY[i].title; $('#lsText').textContent = STORY[i].text; $$('.ls-tabs button', root).forEach((b, k) => b.setAttribute('aria-selected', k === i)); };
  const next = () => { const top = cards[order[0]]; top.classList.add('fly'); setTimeout(() => { top.classList.remove('fly'); order.push(order.shift()); layout(); setCh(order[0]); }, 380); };
  layout();
  $('#stack').addEventListener('click', next);
  $('#stack').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } });
  $$('.ls-tabs button', root).forEach((b) => b.addEventListener('click', () => { const i = Number(b.dataset.ch); while (order[0] !== i) order.push(order.shift()); layout(); setCh(i); }));

  // bento modal
  const modal = $('#modal');
  const closeM = () => { modal.classList.remove('is-open'); modal.setAttribute('aria-hidden', 'true'); document.body.classList.remove('no-scroll'); };
  $$('[data-detail]', root).forEach((b) => b.addEventListener('click', () => { const d = DETAILS.find((x) => x.k === b.dataset.detail);
    $('#modalArt').innerHTML = d.ill(); $('#modalT').textContent = d.t; $('#modalB').innerHTML = d.body(); modal.classList.add('is-open'); modal.setAttribute('aria-hidden', 'false'); document.body.classList.add('no-scroll'); $('.modal__x', modal).focus(); }));
  modal.addEventListener('click', (e) => { if (e.target === modal || e.target.closest('[data-close]')) closeM(); });
  const esc = (e) => { if (e.key === 'Escape') closeM(); }; document.addEventListener('keydown', esc);
  app.cleanup.push(() => { document.removeEventListener('keydown', esc); closeM(); });

  // vision — words darken as you scroll
  const words = $$('#visionT span', root); const vis = $('#vision');
  const onV = () => { const r = vis.getBoundingClientRect(); const p = Math.min(1, Math.max(0, (innerHeight * 0.85 - r.top) / (r.height * 0.9))); const k = Math.round(p * words.length); words.forEach((w, i) => w.classList.toggle('on', i < k)); };
  window.addEventListener('scroll', onV, { passive: true }); onV(); app.cleanup.push(() => window.removeEventListener('scroll', onV));
}

    ${slides.map((s, i) => `<div class="slide" data-i="${i}">${s}</div>`).join('')}

    <div class="stories__cover" data-open role="button" tabindex="0" aria-label="${c.openLabel}"><img class="bgimg" src="${P()}" alt=""><div class="play">${I('play')}</div><div style="color:#fff;font-family:var(--fd);font-size:30px">${CONFIG.groom} &amp; ${CONFIG.bride}</div><div class="cv-hint" style="margin:0">${c.openLabel}</div></div>
  </div>`;
}

function renderCard(c) {
  const root = $('#cardView');
  root.className = 'view cardview';
  root.removeAttribute('style');
  CARD_VARS.forEach((k) => { if (c.v[k]) root.style.setProperty('--' + k, c.v[k]); });
  root.style.setProperty('--pat', PATTERNS[c.dark ? 'stars' : 'jaali'](c.dark ? c.v.accent : '#ffffff', c.dark ? 0.35 : 0.06));
  root.style.setProperty('--pat2', PATTERNS.diamond(c.v.accent || '#fff', 0.5));
  document.title = `${CONFIG.groom} & ${CONFIG.bride} — Invitation`;
  const isStories = c.layout === 'stories';
  root.innerHTML = `<div class="cv-top"><button class="cv-btn" id="cvSound" aria-label="Toggle sound">${I(soundOn ? 'sound' : 'mute')}</button><button class="cv-btn" id="cvReplay" aria-label="Replay">${I('replay')}</button></div>
    <div class="cv-stage">${isStories ? storiesHTML(c) : `
      <div class="cv-opener" id="cvOpener">${c.layout === 'lotus' ? lotusEnvelope(c) : openerHTML(c)}${c.opener === 'scratch' || c.layout === 'lotus' ? '' : `<div class="cv-hint">${c.openLabel}</div>`}</div>
      <div class="cv-card ${c.layout === 'lotus' ? 'cv-card--wide' : ''}" id="cvCard">${c.layout === 'lotus' ? lotusHTML(c) : paperHTML(c)}</div>`}</div>`;
  if (c.layout === 'lotus') petals(root);

  $('#cvSound').addEventListener('click', () => { soundOn = !soundOn; store.set('yn-sound', soundOn); $('#cvSound').innerHTML = I(soundOn ? 'sound' : 'mute'); });
  $('#cvReplay').addEventListener('click', () => { window.scrollTo(0, 0); renderCardKeepCleanup(c); });
  root.onclick = (e) => { if (e.target.closest('[data-ics]')) downloadICS(); };

  if (isStories) return initStories(c);
  let opened = false;
  const open = () => {
    if (opened) return; opened = true;
    const op = $('#cvOpener'), card = $('#cvCard'), btn = $('[data-open]', op);
    chime();
    const timing = { envelope: 900, doors: 1300, gatefold: 1400, scratch: 300, mehendi: 3300, diya: 900 }[c.opener] || 800;
    if (btn) btn.classList.add(c.opener === 'mehendi' ? 'is-drawing' : 'is-open');
    if (c.opener === 'diya') { $('svg', op).classList.add('is-lit'); }
    setTimeout(() => {
      if (c.opener === 'diya') return diyaReveal(op, card);
      op.classList.add('is-gone'); card.classList.add('is-shown');
      requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('is-in')));
      burst();
    }, REDUCED ? 0 : timing);
  };
  $$('[data-open]', root).forEach((b) => b.addEventListener('click', open));
  if (c.opener === 'scratch') initScratch(open);
  if (c.opener === 'mehendi') $$('.mehendi .ink', root).forEach((el) => { try { el.style.setProperty('--len', Math.ceil(el.getTotalLength()) + 1); } catch (e) {} });
}
function renderCardKeepCleanup(c) { app.cleanup.forEach((fn) => { try { fn(); } catch (e) {} }); app.cleanup = []; renderCard(c); }

function burst() {
  if (REDUCED) return;
  const b = document.createElement('div'); b.className = 'burst';
  for (let i = 0; i < 26; i++) { const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220; const s = document.createElement('i');
    s.style.left = '50%'; s.style.top = '40%'; s.style.setProperty('--x', Math.cos(a) * d + 'px'); s.style.setProperty('--y', Math.sin(a) * d + 'px'); s.style.animationDelay = Math.random() * 0.2 + 's'; b.appendChild(s); }
  $('#cardView').appendChild(b); setTimeout(() => b.remove(), 2000);
}

function diyaReveal(op, card) {
  const veil = document.createElement('div'); veil.className = 'diya-glow';
  const warm = document.createElement('div'); warm.className = 'diya-warm';
  const r = $('svg', op).getBoundingClientRect(); veil.style.setProperty('--gy', (r.top + r.height * 0.35) + 'px');
  $('#cardView').append(warm, veil);
  op.classList.add('is-gone'); card.classList.add('is-shown', 'is-in');
  const max = Math.hypot(innerWidth, innerHeight); const t0 = performance.now(); const dur = 2200;
  const frame = (t) => { const p = Math.min(1, (t - t0) / dur); const e = 1 - Math.pow(1 - p, 3); veil.style.setProperty('--r', (e * max) + 'px');
    if (p < 1) requestAnimationFrame(frame); else { veil.remove(); warm.classList.add('on'); } };
  requestAnimationFrame(frame);
}

function initScratch(done) {
  const cv = $('#scratchCv'); const ctx = cv.getContext('2d');
  const size = () => { const r = cv.getBoundingClientRect(); const dpr = Math.min(2, devicePixelRatio || 1); cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr);
    const g = ctx.createLinearGradient(0, 0, r.width, r.height); g.addColorStop(0, '#8a6a2a'); g.addColorStop(.35, '#e8cf8a'); g.addColorStop(.6, '#b8923f'); g.addColorStop(1, '#f2dc9b');
    ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
    ctx.fillStyle = 'rgba(60,40,10,.55)'; ctx.font = '500 13px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('SCRATCH HERE', r.width / 2, r.height / 2);
    ctx.globalCompositeOperation = 'destination-out'; return r; };
  let rect = size(); let down = false, moves = 0, finished = false;
  const pt = (e) => ({ x: e.clientX - rect.left, y: e.clientY - rect.top });
  const scratch = (e) => { const p = pt(e); ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI * 2); ctx.fill(); if (++moves % 12 === 0) check(); };
  const check = () => { if (finished) return; const d = ctx.getImageData(0, 0, cv.width, cv.height).data; let clear = 0, n = 0; for (let i = 3; i < d.length; i += 64) { n++; if (d[i] === 0) clear++; }
    if (clear / n > 0.5) { finished = true; cv.classList.add('is-clear'); chime(); setTimeout(done, 1400); } };
  cv.addEventListener('pointerdown', (e) => { down = true; rect = cv.getBoundingClientRect(); cv.setPointerCapture(e.pointerId); scratch(e); });
  cv.addEventListener('pointermove', (e) => { if (down) scratch(e); });
  cv.addEventListener('pointerup', () => { down = false; check(); });
  cv.addEventListener('pointercancel', () => { down = false; });
}

function initStories(c) {
  const st = $('#stories'), slides = $$('.slide', st), bars = $$('.stories__bars i', st); const DUR = 5000;
  let i = 0, timer = null, started = false, remaining = DUR, t0 = 0;
  const show = (n) => {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle('is-on', k === i));
    bars.forEach((b, k) => { b.classList.toggle('done', k < i); b.classList.remove('run'); });
    void bars[i].offsetWidth; bars[i].style.setProperty('--dur', DUR + 'ms');
    clearTimeout(timer);
    if (i < slides.length - 1) { bars[i].classList.add('run'); remaining = DUR; t0 = Date.now(); timer = setTimeout(() => show(i + 1), DUR); }
    else bars[i].classList.add('done');
  };
  const start = () => { if (started) return; started = true; $('.stories__cover', st).classList.add('is-gone'); chime(); show(0); };
  $('.stories__cover', st).addEventListener('click', start);
  $('.stories__cover', st).addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } });
  $('.stories__tap--prev', st).addEventListener('click', () => started && show(i - 1));
  $('.stories__tap--next', st).addEventListener('click', () => started && show(i + 1));
  // hold to pause
  let holdT;
  st.addEventListener('pointerdown', (e) => { if (!started || e.target.closest('.p-actions')) return; holdT = setTimeout(() => { st.classList.add('is-paused'); clearTimeout(timer); remaining -= Date.now() - t0; }, 220); });
  st.addEventListener('pointerup', () => { clearTimeout(holdT); if (st.classList.contains('is-paused')) { st.classList.remove('is-paused'); t0 = Date.now(); if (i < slides.length - 1) timer = setTimeout(() => show(i + 1), Math.max(300, remaining)); } });
  const key = (e) => { if (!started) return; if (e.key === 'ArrowRight') show(i + 1); if (e.key === 'ArrowLeft') show(i - 1); };
  document.addEventListener('keydown', key);
  app.cleanup.push(() => { clearTimeout(timer); document.removeEventListener('keydown', key); });
}

/* pill hides while scrolling down, returns on scroll up */
let lastY = 0;
window.addEventListener('scroll', () => { const y = scrollY; const pill = $('#pill'); if (!pill) return; pill.classList.toggle('is-tucked', y > lastY + 4 && y > 200); if (y < lastY - 4 || y < 200) pill.classList.remove('is-tucked'); lastY = y; }, { passive: true });

/* ---------------- boot ---------------- */
function boot() {
  $('#pillMenu').addEventListener('click', openDrawer);
  $('#pillPrev').addEventListener('click', () => step(-1));
  $('#pillNext').addEventListener('click', () => step(1));
  $('#pillShare').addEventListener('click', share);
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#scrim').addEventListener('click', closeDrawer);
  $('#drawerHome').addEventListener('click', () => { closeDrawer(); go('home'); });
  $('#drawerShare').addEventListener('click', share);
  $('#drawerPrev').addEventListener('click', () => { closeDrawer(); if (app.route.type === 'home') go(ACTIVE_SITES.length ? 'site' : 'card', ACTIVE_SITES[ACTIVE_SITES.length - 1].id); else step(-1); });
  $('#drawerNext').addEventListener('click', () => { closeDrawer(); if (app.route.type === 'home') go('site', ACTIVE_SITES[0].id); else step(1); });
  $('#drawer').addEventListener('click', (e) => { if (e.target.closest('.d-item')) closeDrawer(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeDrawer(); closeSiteMenu(); } });
  if (GUEST) { $('#drawer').remove(); $('#scrim').remove(); }
  render();
}
if (GUEST) { window.openDrawer = () => {}; }
document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', boot) : boot();
})();

</script>
